<!DOCTYPE html>
<html lang="ru" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все статьи — BELGEE X80</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { teal: '#00f0ff', dark: '#0c1017', card: '#161e2b', border: '#253142', accent: '#10b981', blue: '#2563eb' } }, fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Montserrat', 'sans-serif'] } } } }
    </script>
    <style>
        body { background-color: #0c1017; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Montserrat', sans-serif; }
        .glass-panel { background: rgba(22, 30, 43, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .card-glow { transition: all 0.3s ease; }
        .card-glow:hover { border-color: rgba(0, 240, 255, 0.4); box-shadow: 0 10px 30px -10px rgba(0, 240, 255, 0.15); transform: translateY(-2px); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0c1017; }
        ::-webkit-scrollbar-thumb { background: #253142; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-brand-teal selection:text-black">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 glass-panel border-b border-brand-border/60">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-3 group shrink-0">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-brand-teal flex items-center justify-center shadow-lg shadow-brand-teal/20 group-hover:scale-105 transition-transform">
                    <span class="font-display font-black text-black text-xl">X</span>
                </div>
                <div>
                    <div class="font-display font-black text-xl tracking-wider text-white flex items-center gap-1.5">BELGEE <span class="text-brand-teal">X80</span></div>
                    <div class="text-[10px] text-gray-400 tracking-widest uppercase font-semibold">База знаний</div>
                </div>
            </a>
            <a href="index.html" class="text-sm font-medium text-brand-teal hover:text-white transition-colors"><i class="fa-solid fa-arrow-left mr-1"></i> На главную</a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <div class="mb-10 text-center">
                <h1 class="text-4xl sm:text-5xl font-display font-black text-white mb-4">Все статьи и гайды</h1>
                <p class="text-gray-400 max-w-2xl mx-auto">Полная база знаний клуба BELGEE X80: инструкции по ремонту, обзоры, лайфхаки и доработки.</p>
            </div>

            <!-- ФИЛЬТРЫ И ПОИСК -->
            <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8">
                <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0">
                    <button onclick="filterCat('all')" class="cat-btn px-4 py-2 rounded-xl bg-brand-teal text-black font-semibold text-sm transition-all whitespace-nowrap" data-cat="all">Все</button>
                    <button onclick="filterCat('Обслуживание')" class="cat-btn px-4 py-2 rounded-xl bg-brand-card hover:bg-brand-border text-gray-300 font-medium text-sm transition-all border border-brand-border whitespace-nowrap" data-cat="Обслуживание">Обслуживание</button>
                    <button onclick="filterCat('Тюнинг & Защита')" class="cat-btn px-4 py-2 rounded-xl bg-brand-card hover:bg-brand-border text-gray-300 font-medium text-sm transition-all border border-brand-border whitespace-nowrap" data-cat="Тюнинг & Защита">Тюнинг</button>
                    <button onclick="filterCat('Мультимедиа')" class="cat-btn px-4 py-2 rounded-xl bg-brand-card hover:bg-brand-border text-gray-300 font-medium text-sm transition-all border border-brand-border whitespace-nowrap" data-cat="Мультимедиа">Мультимедиа</button>
                    <button onclick="filterCat('Комфорт')" class="cat-btn px-4 py-2 rounded-xl bg-brand-card hover:bg-brand-border text-gray-300 font-medium text-sm transition-all border border-brand-border whitespace-nowrap" data-cat="Комфорт">Комфорт</button>
                </div>
                <div class="relative w-full md:w-72">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="search-input" onkeyup="searchArticles()" placeholder="Поиск по статьям..." class="w-full bg-brand-card border border-brand-border rounded-xl pl-11 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-teal">
                </div>
            </div>

            <!-- СЕТКА СТАТЕЙ -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="articles-grid">
                <!-- Сюда загрузятся статьи -->
            </div>

            <!-- КНОПКА "ПОКАЗАТЬ ЕЩЕ" -->
            <div class="mt-10 text-center">
                <button id="load-more-btn" onclick="loadMore()" class="hidden px-8 py-3 bg-brand-card border border-brand-border hover:border-brand-teal text-white font-bold rounded-xl transition-all shadow-lg">
                    Показать еще статьи <i class="fa-solid fa-arrow-down ml-2 text-brand-teal"></i>
                </button>
            </div>

        </div>
    </main>

    <!-- MODAL: FULL ARTICLE -->
    <div id="info-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div class="bg-brand-card w-full max-w-3xl rounded-3xl border border-brand-border p-6 sm:p-8 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-5 right-5 text-gray-400 hover:text-white text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="article-modal-header" class="mb-4">
                <span id="info-modal-category" class="px-2.5 py-1 rounded-md bg-blue-500/20 text-blue-400 text-xs font-medium">Категория</span>
                <h3 id="info-modal-title" class="text-2xl font-bold font-display text-white mt-2">Заголовок</h3>
                <div class="flex items-center gap-4 text-xs text-gray-400 mt-2 border-b border-brand-border/60 pb-3">
                    <span id="info-modal-author"></span>
                    <span id="info-modal-time"></span>
                </div>
            </div>
            <div id="info-modal-content" class="text-sm text-gray-300 space-y-4 leading-relaxed"></div>
            <div class="mt-6 pt-4 border-t border-brand-border/60 flex items-center justify-between">
                <span class="text-xs text-gray-500">BELGEE X80 Knowledge Base</span>
                <button onclick="closeModal()" class="px-5 py-2 rounded-xl bg-brand-border hover:bg-brand-teal hover:text-black font-semibold text-xs transition-colors">
                    Закрыть
                </button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-brand-dark py-8 text-gray-400 text-xs border-t border-brand-border text-center">
        <p>© 2026 BELGEE X80 Club Portal. Все права защищены.</p>
    </footer>

    <!-- СКРИПТЫ -->
    <script type="module">
        import { supabase } from './js/config.js';

        let allArticles = [];      
        let filteredArticles = []; 
        let displayedCount = 0;    
        const ITEMS_PER_PAGE = 6;  

        async function loadArticles() {
            const { data, error } = await supabase
                .from('articles')
                .select('*')
                .eq('status', 'published')
                .order('created_at', { ascending: false });

            if (error) {
                document.getElementById('articles-grid').innerHTML = `<p class="text-red-400 col-span-3 text-center">Ошибка загрузки</p>`;
                return;
            }

            allArticles = data || [];
            filterCat('all'); 
        }

        window.filterCat = function(category) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = (btn.dataset.cat === category)
                    ? 'cat-btn px-4 py-2 rounded-xl bg-brand-teal text-black font-semibold text-sm transition-all whitespace-nowrap'
                    : 'cat-btn px-4 py-2 rounded-xl bg-brand-card hover:bg-brand-border text-gray-300 font-medium text-sm transition-all border border-brand-border whitespace-nowrap';
            });

            if (category === 'all') {
                filteredArticles = [...allArticles];
            } else {
                filteredArticles = allArticles.filter(a => a.category === category);
            }

            displayedCount = 0;
            document.getElementById('articles-grid').innerHTML = '';
            loadMore();
        }

        window.searchArticles = function() {
            const query = document.getElementById('search-input').value.toLowerCase();
            filteredArticles = allArticles.filter(a => 
                a.title.toLowerCase().includes(query) || 
                a.summary.toLowerCase().includes(query) ||
                a.author.toLowerCase().includes(query)
            );
            
            displayedCount = 0;
            document.getElementById('articles-grid').innerHTML = '';
            loadMore();
        }

        window.loadMore = function() {
            const grid = document.getElementById('articles-grid');
            const btn = document.getElementById('load-more-btn');
            
            const nextItems = filteredArticles.slice(displayedCount, displayedCount + ITEMS_PER_PAGE);
            
            nextItems.forEach(article => {
                const imgUrl = article.image_url || 'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=600&q=80';

                const div = document.createElement('div');
                div.className = 'bg-brand-card rounded-2xl border border-brand-border card-glow cursor-pointer flex flex-col h-full overflow-hidden';
                div.onclick = () => openArticle(article);
                div.innerHTML = `
                    <div class="h-48 bg-slate-800 relative shrink-0">
                        <img src="${imgUrl}" class="w-full h-full object-cover" alt="${article.title}">
                        <div class="absolute top-3 left-3">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-white bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-md border border-white/10">${article.category}</span>
                        </div>
                    </div>
                    <div class="p-5 flex-1 flex flex-col">
                        <h3 class="font-bold text-lg text-white mb-2 line-clamp-2">${article.title}</h3>
                        <p class="text-sm text-gray-400 line-clamp-2 mb-4 flex-1">${article.summary}</p>
                        <div class="flex items-center justify-between border-t border-brand-border/60 pt-4 mt-auto">
                            <span class="text-xs text-gray-400"><i class="fa-solid fa-user text-brand-teal mr-1"></i> ${article.author}</span>
                            <span class="text-xs text-brand-teal"><i class="fa-regular fa-clock mr-1"></i> ${article.readtime}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(div);
            });

            displayedCount += nextItems.length;

            if (displayedCount >= filteredArticles.length) {
                btn.classList.add('hidden');
            } else {
                btn.classList.remove('hidden');
            }
        }

        window.openArticle = function(article) {
            document.getElementById('info-modal-category').textContent = article.category;
            document.getElementById('info-modal-title').textContent = article.title;
            document.getElementById('info-modal-author').innerHTML = `<i class="fa-solid fa-user text-brand-teal mr-1"></i> ${article.author}`;
            document.getElementById('info-modal-time').innerHTML = `<i class="fa-regular fa-clock mr-1"></i> ${article.readtime}`;
            
            let content = article.content;
            if (article.image_url) {
                content = `<img src="${article.image_url}" class="w-full h-64 object-cover rounded-xl mb-6 shadow-lg" alt="${article.title}">` + content;
            }
            
            document.getElementById('info-modal-content').innerHTML = content;
            document.getElementById('info-modal').classList.remove('hidden');
        }

        window.closeModal = function() {
            document.getElementById('info-modal').classList.add('hidden');
        }

        // Инициализация
        loadArticles();
    </script>
</body>
</html>
