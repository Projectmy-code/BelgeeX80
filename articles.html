<!DOCTYPE html>
<html lang="ru" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все статьи — BELGEE X80</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <link rel="stylesheet" href="./css/article-content.css">

    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { teal: '#00f0ff', dark: '#0c1017', card: '#161e2b', border: '#253142', accent: '#10b981', blue: '#2563eb' } }, fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Montserrat', 'sans-serif'] } } } }
    </script>
    <style>
        body { background-color: #0c1017; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Montserrat', sans-serif; }
        .glass-panel { background: rgba(22, 30, 43, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .card-glow { transition: all 0.3s ease; }
        .card-glow:hover { border-color: rgba(0, 240, 255, 0.4); box-shadow: 0 10px 30px -10px rgba(0, 240, 255, 0.15); transform: translateY(-2px); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0c1017; }
        ::-webkit-scrollbar-thumb { background: #253142; border-radius: 4px; }
        
        /* Красивый ползунок */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; margin: 16px 0; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #253142; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #00f0ff; }

        /* ЖЕСТКИЕ СТИЛИ ДЛЯ КАРТИНОК В СТАТЬЯХ */
        #info-modal-content img {
            border-radius: 16px !important;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.8) !important;
            margin: 24px auto !important;
            display: block !important;
            max-width: 100% !important;
            height: auto !important;
            border: none !important;
        }

        /* Стили для Quill в полноэкранном редакторе */
        .ql-toolbar.ql-snow { border-color: #253142 !important; background-color: #0c1017; border-radius: 12px 12px 0 0; padding: 12px; border-top: none; border-left: none; border-right: none; position: sticky; top: 0; z-index: 10; }
        .ql-container.ql-snow { border: none !important; font-family: 'Inter', sans-serif; font-size: 16px; color: #e2e8f0; }
        .ql-editor { padding: 24px; color: #e2e8f0; line-height: 1.8; min-height: 400px; }
        .ql-editor.ql-blank::before { color: #6b7891 !important; font-style: normal; }
        .ql-snow .ql-stroke { stroke: #6b7891; }
        .ql-snow .ql-fill { fill: #6b7891; }
        .ql-snow .ql-picker { color: #6b7891; }
        .ql-snow.ql-toolbar button:hover .ql-stroke, .ql-snow.ql-toolbar button.ql-active .ql-stroke { stroke: #00f0ff !important; }
        .ql-snow.ql-toolbar button:hover .ql-fill, .ql-snow.ql-toolbar button.ql-active .ql-fill { fill: #00f0ff !important; }
        .ql-snow.ql-toolbar button:hover, .ql-snow.ql-toolbar button.ql-active { color: #00f0ff !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-brand-teal selection:text-black">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 glass-panel border-b border-brand-border/60">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-3 group shrink-0">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-brand-teal flex items-center justify-center shadow-lg shadow-brand-teal/20 group-hover:scale-105 transition-transform">
                    <span class="font-display font-black text-black text-xl">X</span>
                </div>
                <div>
                    <div class="font-display font-black text-xl tracking-wider text-white flex items-center gap-1.5">BELGEE <span class="text-brand-teal">X80</span></div>
                    <div class="text-[10px] text-gray-400 tracking-widest uppercase font-semibold">База знаний</div>
                </div>
            </a>
            <!-- Кнопка "Добавить" в шапке (скрыта на мобильных, так как там есть FAB) -->
            <div class="flex items-center gap-4">
                <button onclick="openSubmission()" class="hidden sm:inline-flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-brand-teal to-blue-500 text-black font-bold text-xs rounded-xl shadow-lg hover:scale-105 transition-all whitespace-nowrap">
                    <i class="fa-solid fa-plus text-sm"></i>
                    <span>Добавить статью</span>
                </button>
                <a href="index.html" class="text-sm font-medium text-brand-teal hover:text-white transition-colors"><i class="fa-solid fa-arrow-left mr-1"></i> На главную</a>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <div class="mb-10 text-center">
                <h1 class="text-4xl sm:text-5xl font-display font-black text-white mb-4">Все статьи и гайды</h1>
                <p class="text-gray-400 max-w-2xl mx-auto">Полная база знаний клуба BELGEE X80: инструкции по ремонту, обзоры, лайфхаки и доработки.</p>
            </div>

            <!-- ФИЛЬТРЫ И ПОИСК -->
            <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8">
                <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0">
                    <button onclick="filterCat('all')" class="cat-btn px-4 py-2 rounded-xl bg-brand-teal text-black font-semibold text-sm transition-all whitespace-nowrap" data-cat="all">Все</button>
                    <button onclick="filterCat('Обслуживание')" class="cat-btn px-4 py-2 rounded-xl bg-brand-card hover:bg-brand-border text-gray-300 font-medium text-sm transition-all border border-brand-border whitespace-nowrap" data-cat="Обслуживание">Обслуживание</button>
                    <button onclick="filterCat('Тюнинг & Защита')" class="cat-btn px-4 py-2 rounded-xl bg-brand-card hover:bg-brand-border text-gray-300 font-medium text-sm transition-all border border-brand-border whitespace-nowrap" data-cat="Тюнинг & Защита">Тюнинг</button>
                    <button onclick="filterCat('Мультимедиа')" class="cat-btn px-4 py-2 rounded-xl bg-brand-card hover:bg-brand-border text-gray-300 font-medium text-sm transition-all border border-brand-border whitespace-nowrap" data-cat="Мультимедиа">Мультимедиа</button>
                    <button onclick="filterCat('Комфорт')" class="cat-btn px-4 py-2 rounded-xl bg-brand-card hover:bg-brand-border text-gray-300 font-medium text-sm transition-all border border-brand-border whitespace-nowrap" data-cat="Комфорт">Комфорт</button>
                </div>
                <div class="relative w-full md:w-72">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="search-input" onkeyup="searchArticles()" placeholder="Поиск по статьям..." class="w-full bg-brand-card border border-brand-border rounded-xl pl-11 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-teal">
                </div>
            </div>

            <!-- СЕТКА СТАТЕЙ -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="articles-grid">
                <!-- Сюда загрузятся статьи -->
            </div>

            <!-- КНОПКА "ПОКАЗАТЬ ЕЩЕ" -->
            <div class="mt-10 text-center">
                <button id="load-more-btn" onclick="loadMore()" class="hidden px-8 py-3 bg-brand-card border border-brand-border hover:border-brand-teal text-white font-bold rounded-xl transition-all shadow-lg">
                    Показать еще статьи <i class="fa-solid fa-arrow-down ml-2 text-brand-teal"></i>
                </button>
            </div>

        </div>
    </main>

    <!-- ПЛАВАЮЩАЯ КНОПКА (FAB) ДЛЯ ДОБАВЛЕНИЯ СТАТЬИ НА МОБИЛЬНЫХ -->
    <button onclick="openSubmission()" class="sm:hidden fixed bottom-6 right-6 z-40 w-14 h-14 bg-gradient-to-r from-brand-teal to-blue-500 text-black rounded-full shadow-2xl flex items-center justify-center text-2xl hover:scale-110 transition-transform">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- MODAL: FULL ARTICLE -->
    <div id="info-modal" onclick="closeModalOnBg(event)" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div class="bg-brand-card w-full max-w-3xl rounded-3xl border border-brand-border p-6 sm:p-8 shadow-2xl relative max-h-[90vh] overflow-y-auto custom-scrollbar" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-5 right-5 text-gray-400 hover:text-white text-lg z-10">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="article-modal-header" class="mb-4">
                <span id="info-modal-category" class="px-2.5 py-1 rounded-md bg-blue-500/20 text-blue-400 text-xs font-medium">Категория</span>
                <h3 id="info-modal-title" class="text-2xl font-bold font-display text-white mt-2">Заголовок</h3>
                <div class="flex items-center gap-4 text-xs text-gray-400 mt-2 border-b border-brand-border/60 pb-3">
                    <span id="info-modal-author"></span>
                    <span id="info-modal-time"></span>
                </div>
            </div>
            <div id="info-modal-content" class="content-html text-sm text-gray-300 leading-relaxed"></div>
            <div class="mt-6 pt-4 border-t border-brand-border/60 flex items-center justify-between">
                <span class="text-xs text-gray-500">BELGEE X80 Knowledge Base</span>
                <button onclick="closeModal()" class="px-5 py-2 rounded-xl bg-brand-border hover:bg-brand-teal hover:text-black font-semibold text-xs transition-colors">
                    Закрыть
                </button>
            </div>
        </div>
    </div>

    <!-- ============================================== -->
    <!-- ПОЛНОЭКРАННЫЙ РЕДАКТОР (СКОПИРОВАН С ГЛАВНОЙ) -->
    <!-- ============================================== -->
    <div id="add-article-modal" class="fixed inset-0 z-[100] hidden bg-brand-dark h-[100dvh] w-screen overflow-hidden flex-col">
        <header class="h-16 shrink-0 bg-brand-card border-b border-brand-border flex items-center justify-between px-4 sm:px-6 z-20 relative">
            <div class="flex items-center gap-3">
                <button type="button" onclick="closeEditor()" class="w-8 h-8 rounded-full bg-brand-border hover:bg-red-500/20 text-gray-400 hover:text-red-400 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div>
                    <div class="font-bold text-white text-sm sm:text-base">Новая статья</div>
                    <div class="text-[10px] text-gray-500">Черновик сохраняется</div>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button type="button" onclick="closeEditor()" class="px-4 py-2 text-sm font-semibold text-gray-400 hover:text-white transition-colors hidden sm:block">
                    Отмена
                </button>
                <button type="submit" form="add-article-form" id="submit-article-btn" class="px-5 py-2 bg-gradient-to-r from-brand-teal to-blue-500 text-black font-bold text-sm rounded-lg shadow-lg hover:scale-105 transition-all">
                    Отправить
                </button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto w-full">
            <form id="add-article-form" onsubmit="handleAddArticleSubmit(event)" class="flex flex-col lg:flex-row min-h-full">
                
                <div class="flex-1 flex flex-col bg-[#0c1017]">
                    <div class="max-w-3xl w-full mx-auto py-8 px-4 sm:px-8">
                        <input type="text" id="new-title" required placeholder="Заголовок статьи..." class="w-full bg-transparent text-3xl sm:text-4xl font-display font-bold text-white placeholder-gray-600 focus:outline-none mb-6">
                        
                        <div class="border border-brand-border rounded-2xl overflow-hidden shadow-2xl bg-brand-dark">
                            <div id="editor-container"></div>
                        </div>
                    </div>
                </div>

                <aside class="w-full lg:w-80 shrink-0 bg-brand-card border-t lg:border-t-0 lg:border-l border-brand-border p-6 space-y-6">
                    
                    <div>
                        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Обложка</h3>
                        <label class="block w-full aspect-video rounded-xl border-2 border-dashed border-brand-border hover:border-brand-teal bg-brand-dark flex flex-col items-center justify-center cursor-pointer transition-colors relative overflow-hidden group">
                            <input type="file" id="new-image-file" accept="image/*" class="hidden">
                            <div id="cover-preview-container" class="absolute inset-0 hidden">
                                <img id="cover-preview-img" class="w-full h-full object-cover" alt="Превью">
                                <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                                    <i class="fa-solid fa-pen text-white text-xl"></i>
                                </div>
                            </div>
                            <div class="text-center text-gray-500 group-hover:text-brand-teal transition-colors" id="cover-placeholder">
                                <i class="fa-regular fa-image text-2xl mb-2"></i>
                                <div class="text-xs font-semibold">Загрузить фото</div>
                            </div>
                        </label>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Категория</label>
                            <select id="new-category" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-teal">
                                <option value="Тюнинг & Защита">Тюнинг & Защита</option>
                                <option value="Мультимедиа">Мультимедиа</option>
                                <option value="Комфорт">Комфорт</option>
                                <option value="Электрика">Электрика</option>
                                <option value="Обслуживание">Обслуживание</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Время чтения</label>
                            <input type="text" id="new-readtime" value="5 мин чтения" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-teal">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Автор</label>
                            <input type="text" id="new-author" required placeholder="Ваш никнейм" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-teal">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Краткое описание</label>
                            <textarea id="new-summary" rows="4" required placeholder="О чем эта статья в 2-3 предложениях..." class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-teal resize-none"></textarea>
                        </div>
                    </div>

                    <button type="submit" class="w-full lg:hidden py-3 bg-brand-teal text-black font-bold rounded-xl shadow-lg mt-4">
                        Отправить на модерацию
                    </button>

                </aside>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-brand-dark py-8 text-gray-400 text-xs border-t border-brand-border text-center">
        <p>© 2026 BELGEE X80 Club Portal. Все права защищены.</p>
    </footer>

    <!-- СКРИПТЫ -->
    <script type="module">
        import { supabase } from './js/config.js';

        let allArticles = [];      
        let filteredArticles = []; 
        let displayedCount = 0;    
        const ITEMS_PER_PAGE = 6;  

        async function loadArticles() {
            const { data, error } = await supabase
                .from('articles')
                .select('*')
                .eq('status', 'published')
                .order('created_at', { ascending: false });

            if (error) {
                document.getElementById('articles-grid').innerHTML = `<p class="text-red-400 col-span-3 text-center">Ошибка загрузки</p>`;
                return;
            }

            allArticles = data || [];
            filterCat('all'); 
        }

        window.filterCat = function(category) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = (btn.dataset.cat === category)
                    ? 'cat-btn px-4 py-2 rounded-xl bg-brand-teal text-black font-semibold text-sm transition-all whitespace-nowrap'
                    : 'cat-btn px-4 py-2 rounded-xl bg-brand-card hover:bg-brand-border text-gray-300 font-medium text-sm transition-all border border-brand-border whitespace-nowrap';
            });

            if (category === 'all') {
                filteredArticles = [...allArticles];
            } else {
                filteredArticles = allArticles.filter(a => a.category === category);
            }

            displayedCount = 0;
            document.getElementById('articles-grid').innerHTML = '';
            loadMore();
        }

        window.searchArticles = function() {
            const query = document.getElementById('search-input').value.toLowerCase();
            filteredArticles = allArticles.filter(a => 
                (a.title || '').toLowerCase().includes(query) || 
                (a.summary || '').toLowerCase().includes(query) ||
                (a.author || '').toLowerCase().includes(query)
            );
            
            displayedCount = 0;
            document.getElementById('articles-grid').innerHTML = '';
            loadMore();
        }

        window.loadMore = function() {
            const grid = document.getElementById('articles-grid');
            const btn = document.getElementById('load-more-btn');
            
            const nextItems = filteredArticles.slice(displayedCount, displayedCount + ITEMS_PER_PAGE);
            
            nextItems.forEach(article => {
                const imgUrl = article.image_url || 'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=600&q=80';

                const div = document.createElement('div');
                div.className = 'bg-brand-card rounded-2xl border border-brand-border card-glow cursor-pointer flex flex-col h-full overflow-hidden';
                div.onclick = () => openArticle(article);
                div.innerHTML = `
                    <div class="h-48 bg-slate-800 relative shrink-0">
                        <img src="${imgUrl}" class="w-full h-full object-cover" alt="${article.title}">
                        <div class="absolute top-3 left-3">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-white bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-md border border-white/10">${article.category}</span>
                        </div>
                    </div>
                    <div class="p-5 flex-1 flex flex-col">
                        <h3 class="font-bold text-lg text-white mb-2 line-clamp-2">${article.title}</h3>
                        <p class="text-sm text-gray-400 line-clamp-2 mb-4 flex-1">${article.summary}</p>
                        <div class="flex items-center justify-between border-t border-brand-border/60 pt-4 mt-auto">
                            <span class="text-xs text-gray-400"><i class="fa-solid fa-user text-brand-teal mr-1"></i> ${article.author}</span>
                            <span class="text-xs text-brand-teal"><i class="fa-regular fa-clock mr-1"></i> ${article.readtime}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(div);
            });

            displayedCount += nextItems.length;

            if (displayedCount >= filteredArticles.length) {
                btn.classList.add('hidden');
            } else {
                btn.classList.remove('hidden');
            }
        }

        window.openArticle = function(article) {
            document.getElementById('info-modal-category').textContent = article.category;
            document.getElementById('info-modal-title').textContent = article.title;
            document.getElementById('info-modal-author').innerHTML = `<i class="fa-solid fa-user text-brand-teal mr-1"></i> ${article.author}`;
            document.getElementById('info-modal-time').innerHTML = `<i class="fa-regular fa-clock mr-1"></i> ${article.readtime}`;
            
            let content = article.content || '';
            
            if (article.image_url) {
                content = `<figure><img src="${article.image_url}" alt="${article.title}" loading="lazy"></figure>` + `<div class="content-html">${content}</div>`;
            } else {
                content = `<div class="content-html">${content}</div>`;
            }
            
            const contentEl = document.getElementById('info-modal-content');
            contentEl.innerHTML = content;
            document.getElementById('info-modal').classList.remove('hidden');
            document.documentElement.style.overflow = 'hidden';
            document.body.style.overflow = 'hidden';

            // Принудительные стили для картинок
            setTimeout(() => {
                contentEl.querySelectorAll('img').forEach(img => {
                    img.style.setProperty('border-radius', '16px', 'important');
                    img.style.setProperty('box-shadow', '0 10px 30px -10px rgba(0,0,0,0.8)', 'important');
                    img.style.setProperty('margin', '24px auto', 'important');
                    img.style.setProperty('display', 'block', 'important');
                    img.style.setProperty('max-width', '100%', 'important');
                    img.style.setProperty('height', 'auto', 'important');
                    img.style.setProperty('border', 'none', 'important');
                });
            }, 100);
        }

        window.closeModal = function() {
            document.getElementById('info-modal').classList.add('hidden');
            document.documentElement.style.overflow = '';
            document.body.style.overflow = '';
        }

        window.closeModalOnBg = function(event) {
            if (event.target.id === 'info-modal') {
                document.getElementById('info-modal').classList.add('hidden');
                document.documentElement.style.overflow = '';
                document.body.style.overflow = '';
            }
        }

        // Инициализация
        loadArticles();
    </script>
    <!-- Подключаем скрипт для работы редактора (openSubmission и т.д.) -->
    <script type="module" src="./js/articles.js"></script>
</body>
</html>
