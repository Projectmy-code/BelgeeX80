<!doctype html><html lang="ru" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — BELGEE X80</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#0c1017] text-white flex items-center justify-center p-4"><main class="w-full max-w-md bg-[#161e2b] rounded-2xl border border-[#253142] p-7"><a class="text-cyan-400" href="index.html">← На главную</a><h1 class="text-2xl font-bold mt-5 mb-2">BELGEE X80 — аккаунт</h1><p class="text-gray-400 text-sm mb-6">Войдите или создайте аккаунт</p><form id="auth-form" class="space-y-4"><input id="name" class="w-full bg-[#0c1017] border border-gray-700 p-3 rounded-lg" placeholder="Ваш ник (для регистрации)"><input id="email" type="email" required class="w-full bg-[#0c1017] border border-gray-700 p-3 rounded-lg" placeholder="Email"><input id="password" type="password" minlength="8" required class="w-full bg-[#0c1017] border border-gray-700 p-3 rounded-lg" placeholder="Пароль (от 8 символов)"><div class="flex gap-2"><button type="submit" data-action="login" class="flex-1 bg-cyan-400 text-black font-bold p-3 rounded-lg">Войти</button><button type="button" id="signup" class="flex-1 bg-[#253142] p-3 rounded-lg">Регистрация</button></div></form><p id="message" role="status" class="text-sm text-cyan-300 mt-4"></p></main><script type="module">
import {db,currentUser,adminStatus} from './js/api.js';const msg=document.getElementById('message');async function act(signup){if(!db){msg.textContent='Сначала заполните js/config.js';return;}const email=document.getElementById('email').value,password=document.getElementById('password').value,display_name=document.getElementById('name').value.trim();if(!email||password.length<8){msg.textContent='Укажите email и пароль от 8 символов';return;}const {data,error}=signup?await db.auth.signUp({email,password,options:{data:{display_name}}}):await db.auth.signInWithPassword({email,password});if(error){msg.textContent=error.message;return;}if(signup&&!data.session){msg.textContent='Проверьте почту для подтверждения регистрации.';return;}location.href=await adminStatus()?'admin.html':'index.html';}document.getElementById('auth-form').onsubmit=e=>{e.preventDefault();act(false)};document.getElementById('signup').onclick=()=>act(true);if(await currentUser())msg.textContent='Вы уже вошли в аккаунт.';
</script></body></html>
