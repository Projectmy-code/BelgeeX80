<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — BELGEE X80</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { teal: '#00f0ff', dark: '#0c1017', card: '#161e2b', border: '#253142' } } } } }
    </script>
    <style> 
        body { background-color: #0c1017; color: white; font-family: sans-serif; } 
        /* Фикс для мобильных: разрешаем клики по форме */
        form, button, input { pointer-events: auto !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    
    <!-- z-[999] поднимает форму выше любых мобильных меню -->
    <div class="bg-brand-card w-full max-w-md p-8 rounded-3xl border border-brand-border shadow-2xl relative z-[999]">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold mb-2">Вход в клуб</h1>
            <p class="text-gray-400 text-sm">Авторизуйтесь, чтобы предлагать статьи</p>
        </div>

        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1">Email</label>
                <input type="email" id="email" required class="w-full bg-brand-dark border border-brand-border rounded-xl px-4 py-3 text-sm text-white focus:border-brand-teal focus:outline-none relative z-[1000]">
            </div>
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs text-gray-400">Пароль</label>
                    <button type="button" id="forgot-password-btn" class="text-xs text-brand-teal hover:underline focus:outline-none relative z-[1000]">Забыли пароль?</button>
                </div>
                <input type="password" id="password" required class="w-full bg-brand-dark border border-brand-border rounded-xl px-4 py-3 text-sm text-white focus:border-brand-teal focus:outline-none relative z-[1000]">
            </div>
            
            <div id="error-msg" class="text-red-400 text-xs hidden"></div>
            <div id="success-msg" class="text-emerald-400 text-xs hidden"></div>

            <button type="submit" id="submit-btn" class="w-full py-3 bg-brand-teal text-black font-bold rounded-xl hover:opacity-90 transition-all relative z-[1000]">Войти</button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-400 relative z-[1000]">
            <span id="toggle-text">Нет аккаунта?</span>
            <button id="toggle-btn" class="text-brand-teal hover:underline ml-1">Зарегистрироваться</button>
        </div>
        
        <div class="mt-6 text-center relative z-[1000]">
            <a href="index.html" class="text-xs text-gray-500 hover:text-white">← Вернуться на главную</a>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/config.js';

        let isLoginMode = true;
        const form = document.getElementById('auth-form');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');

        document.getElementById('toggle-btn').addEventListener('click', (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            document.getElementById('submit-btn').textContent = isLoginMode ? 'Войти' : 'Зарегистрироваться';
            document.getElementById('toggle-text').textContent = isLoginMode ? 'Нет аккаунта?' : 'Уже есть аккаунт?';
            document.getElementById('toggle-btn').textContent = isLoginMode ? 'Зарегистрироваться' : 'Войти';
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submit-btn');
            
            btn.disabled = true;
            btn.textContent = 'Загрузка...';
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            try {
                if (isLoginMode) {
                    // ПРИНУДИТЕЛЬНЫЙ ТАЙМАУТ (10 секунд)
                    // Если мобильный интернет блокирует Supabase, мы не будем висеть вечно
                    const loginPromise = supabase.auth.signInWithPassword({ email, password });
                    const timeoutPromise = new Promise((_, reject) => 
                        setTimeout(() => reject(new Error('Превышено время ожидания. Скорее всего, сеть блокирует запрос к Supabase. Попробуйте включить VPN.')), 10000)
                    );

                    const { data, error } = await Promise.race([loginPromise, timeoutPromise]);
                    
                    if (error) {
                        alert("ОШИБКА ВХОДА: " + error.message); 
                        throw error;
                    }
                    
                    if (!data.session) {
                        alert("ОШИБКА: Сессия не создалась. Проверьте, подтвержден ли Email в панели Supabase.");
                        throw new Error('Не удалось создать сессию.');
                    }
                    
                    // Небольшая задержка, чтобы токен 100% сохранился в память телефона
                    btn.textContent = 'Успех! Переход...';
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                    
                } else {
                    // РЕЖИМ РЕГИСТРАЦИИ
                    const { error } = await supabase.auth.signUp({ email, password });
                    if (error) {
                        alert("ОШИБКА РЕГИСТРАЦИИ: " + error.message);
                        throw error;
                    }
                    successMsg.textContent = 'Регистрация успешна! Теперь вы можете войти.';
                    successMsg.classList.remove('hidden');
                    document.getElementById('toggle-btn').click();
                }
            } catch (error) {
                console.error(error);
                errorMsg.textContent = "Ошибка: " + (error.message || "Не удалось выполнить вход");
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = isLoginMode ? 'Войти' : 'Зарегистрироваться';
            }
        });

        // Логика сброса пароля
        document.getElementById('forgot-password-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                errorMsg.textContent = 'Пожалуйста, введите ваш Email в поле выше, чтобы мы отправили ссылку.';
                errorMsg.classList.remove('hidden');
                return;
            }

            const btn = e.target;
            const originalText = btn.textContent;
            btn.textContent = 'Отправка...';
            btn.disabled = true;

            const redirectTo = window.location.origin + window.location.pathname.replace('login.html', 'update-password.html');

            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: redirectTo
            });

            btn.textContent = originalText;
            btn.disabled = false;
            errorMsg.classList.add('hidden');

            if (error) {
                alert("ОШИБКА СБРОСА: " + error.message);
                errorMsg.textContent = 'Ошибка: ' + error.message;
                errorMsg.classList.remove('hidden');
            } else {
                successMsg.textContent = 'Ссылка для сброса пароля отправлена на вашу почту! Проверьте папку «Спам».';
                successMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
