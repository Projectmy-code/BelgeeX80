<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход и регистрация — BELGEE X80</title><link rel="stylesheet" href="css/shared.css"></head><body><header class="site-header glass-panel"><a class="brand-logo" href="index.html"><span class="mark">X</span><span>BELGEE <em>X80</em></span></a><nav class="site-nav" aria-label="Навигация"><a href="index.html#catalog">Каталог</a><a href="index.html#articles">Статьи</a><a href="index.html#community">Клуб</a><a href="login.html">Аккаунт</a><a href="admin.html">Админ-панель</a></nav></header><main class="auth-shell"><section class="panel glass-panel auth-panel card-glow"><div class="eyebrow">Клуб владельцев</div><h1 class="section-title">Вход в BELGEE X80</h1><p class="section-desc">Войдите или создайте аккаунт. Гости тоже могут предлагать статьи, если администрация разрешила.</p><form id="auth-form" class="auth-form"><label>Никнейм (при регистрации)<input id="name" class="field" autocomplete="nickname" placeholder="Например, X80_Driver"></label><label>Email<input id="email" class="field" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Пароль<input id="password" class="field" type="password" minlength="8" required autocomplete="current-password" placeholder="Не менее 8 символов"></label><div class="action-row"><button type="submit" class="btn btn-primary" style="flex:1">Войти</button><button type="button" id="signup" class="btn btn-secondary" style="flex:1">Регистрация</button></div></form><p id="message" role="status" class="notice" aria-live="polite"></p></section></main><script type="module">
import {db,currentUser,adminStatus} from './js/api.js';const msg=document.getElementById('message');async function act(signup){if(!db){msg.textContent='Сначала заполните js/config.js';return;}const email=document.getElementById('email').value,password=document.getElementById('password').value,display_name=document.getElementById('name').value.trim();if(!email||password.length<8){msg.textContent='Укажите email и пароль от 8 символов';return;}const {data,error}=signup?await db.auth.signUp({email,password,options:{data:{display_name}}}):await db.auth.signInWithPassword({email,password});if(error){msg.textContent=error.message;return;}if(signup&&!data.session){msg.textContent='Проверьте почту для подтверждения регистрации.';return;}location.href=await adminStatus()?'admin.html':'index.html';}document.getElementById('auth-form').onsubmit=e=>{e.preventDefault();act(false)};document.getElementById('signup').onclick=()=>act(true);if(await currentUser())msg.textContent='Вы уже вошли в аккаунт.';
</script></body></html>
