<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS — BELGEE X80</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { teal: '#00f0ff', dark: '#0c1017', card: '#161e2b', border: '#253142', accent: '#10b981', blue: '#2563eb', pending: '#f59e0b' } }, fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Montserrat', 'sans-serif'] } } } }
    </script>
    <style>
        body { background-color: #0c1017; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Montserrat', sans-serif; }
        .glass-panel { background: rgba(22, 30, 43, 0.95); backdrop-filter: blur(12px); border-right: 1px solid #253142; }
        .nav-item { transition: all 0.2s; border-left: 3px solid transparent; }
        .nav-item:hover { background: rgba(255,255,255,0.05); }
        .nav-item.active { background: rgba(0, 240, 255, 0.1); border-left-color: #00f0ff; color: #00f0ff; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0c1017; }
        ::-webkit-scrollbar-thumb { background: #253142; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex antialiased">

    <aside class="w-64 glass-panel fixed h-full flex flex-col z-20">
        <div class="h-20 flex items-center px-6 border-b border-brand-border">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-brand-teal flex items-center justify-center">
                    <span class="font-display font-black text-black text-sm">X</span>
                </div>
                <div>
                    <div class="font-display font-black text-sm text-white">CMS</div>
                    <div class="text-[10px] text-gray-400 uppercase">BELGEE X80</div>
                </div>
            </div>
        </div>

        <nav class="flex-1 py-6 flex flex-col gap-1 overflow-y-auto">
            <a href="#" onclick="switchView('dashboard')" id="nav-dashboard" class="nav-item active px-6 py-3 flex items-center gap-3 text-sm font-medium text-gray-300">
                <i class="fa-solid fa-chart-pie w-5 text-center"></i> Дашборд
            </a>
            <a href="#" onclick="switchView('moderation')" id="nav-moderation" class="nav-item px-6 py-3 flex items-center gap-3 text-sm font-medium text-gray-300">
                <i class="fa-solid fa-shield-halved w-5 text-center"></i> Модерация
                <span id="mod-badge" class="ml-auto bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full hidden">0</span>
            </a>
            <a href="#" onclick="switchView('feedback')" id="nav-feedback" class="nav-item px-6 py-3 flex items-center gap-3 text-sm font-medium text-gray-300">
                <i class="fa-solid fa-envelope w-5 text-center"></i> Сообщения
                <span id="fb-badge" class="ml-auto bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full hidden">0</span>
            </a>
            <a href="#" onclick="switchView('settings')" id="nav-settings" class="nav-item px-6 py-3 flex items-center gap-3 text-sm font-medium text-gray-300">
                <i class="fa-solid fa-gear w-5 text-center"></i> Настройки
            </a>
            <div class="px-6 py-3 text-[10px] font-bold text-gray-500 uppercase tracking-wider mt-4">Инструменты</div>
            <a href="edit-parts.html" class="nav-item px-6 py-3 flex items-center gap-3 text-sm font-medium text-gray-300">
                <i class="fa-solid fa-list-check w-5 text-center"></i> Каталог запчастей
            </a>
            <a href="edit-site.html" class="nav-item px-6 py-3 flex items-center gap-3 text-sm font-medium text-gray-300">
                <i class="fa-solid fa-sliders w-5 text-center"></i> Редактор главной
            </a>
            <a href="builder.html" class="nav-item px-6 py-3 flex items-center gap-3 text-sm font-medium text-gray-300">
                <i class="fa-solid fa-wand-magic-sparkles w-5 text-center"></i> Конструктор страниц
            </a>
            <a href="index.html" class="nav-item px-6 py-3 flex items-center gap-3 text-sm font-medium text-gray-300">
                <i class="fa-solid fa-arrow-up-right-from-square w-5 text-center"></i> Открыть сайт
            </a>
        </nav>

        <div class="p-4 border-t border-brand-border">
            <div class="bg-brand-dark rounded-xl p-3 flex items-center gap-3 border border-brand-border">
                <div class="w-8 h-8 rounded-full bg-brand-teal/20 text-brand-teal flex items-center justify-center font-bold">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="flex-1 overflow-hidden">
                    <div id="user-email" class="text-xs text-white truncate font-semibold">Загрузка...</div>
                    <button onclick="logout()" class="text-[10px] text-red-400 hover:text-red-300">Выйти</button>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 ml-64 min-h-screen relative">
        <div id="view-loading" class="absolute inset-0 flex items-center justify-center bg-brand-dark z-10">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-brand-teal"></i>
        </div>
        <div id="view-denied" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-brand-dark z-10">
            <i class="fa-solid fa-lock text-5xl text-red-500 mb-4"></i>
            <h2 class="text-2xl font-bold text-white mb-2">Доступ запрещен</h2>
            <p class="text-gray-400 text-sm">У вас нет прав администратора.</p>
        </div>
        <div id="view-content" class="hidden p-8"></div>
    </main>

    <div id="confirm-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-brand-card w-full max-w-sm rounded-3xl border border-brand-border p-6 shadow-2xl relative transform scale-95 transition-transform duration-300">
            <h3 id="conf-title" class="text-xl font-bold text-center text-white mb-2">Удалить?</h3>
            <p id="conf-msg" class="text-sm text-gray-400 text-center mb-6">Это действие нельзя отменить.</p>
            <div class="flex gap-3">
                <button onclick="closeConfirm(false)" class="flex-1 py-2.5 rounded-xl bg-brand-border hover:bg-gray-700 text-white font-semibold text-sm">Отмена</button>
                <button id="conf-ok" class="flex-1 py-2.5 rounded-xl bg-red-500 hover:bg-red-600 text-white font-semibold text-sm">Удалить</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/config.js';
        let currentUser = null;
        let allData = { articles: [], models: [], feedback: [] };

        let confirmResolve;
        window.showConfirm = (title, msg) => {
            return new Promise(res => {
                confirmResolve = res;
                document.getElementById('conf-title').textContent = title;
                document.getElementById('conf-msg').textContent = msg;
                document.getElementById('confirm-modal').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('confirm-modal').classList.remove('opacity-0');
                    document.getElementById('confirm-modal').querySelector('div').classList.remove('scale-95');
                }, 10);
            });
        };
        window.closeConfirm = (res) => {
            document.getElementById('confirm-modal').classList.add('opacity-0');
            document.getElementById('confirm-modal').querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                document.getElementById('confirm-modal').classList.add('hidden');
                if (confirmResolve) confirmResolve(res);
            }, 300);
        };
        document.getElementById('conf-ok').addEventListener('click', () => closeConfirm(true));

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            
            currentUser = session.user;
            document.getElementById('user-email').textContent = currentUser.email;
            const { data: adminData } = await supabase.from('admins').select('user_id').eq('user_id', currentUser.id).maybeSingle();
            
            document.getElementById('view-loading').classList.add('hidden');
            if (!adminData) { document.getElementById('view-denied').classList.remove('hidden'); return; }

            document.getElementById('view-content').classList.remove('hidden');
            await loadAllData();
            switchView('dashboard');
        }

        async function loadAllData() {
            const [arts, mods, fb] = await Promise.all([
                supabase.from('articles').select('*').order('created_at', { ascending: false }),
                supabase.from('models_3d').select('*').order('created_at', { ascending: false }),
                supabase.from('feedback').select('*').order('created_at', { ascending: false })
            ]);
            
            allData.articles = arts.data || [];
            allData.models = mods.data || [];
            allData.feedback = fb.data || [];

            const pendingMods = allData.articles.filter(a => a.status === 'pending').length + allData.models.filter(m => m.status === 'pending').length;
            const unreadFb = allData.feedback.filter(f => !f.is_read).length;

            if (pendingMods > 0) { document.getElementById('mod-badge').textContent = pendingMods; document.getElementById('mod-badge').classList.remove('hidden'); } else { document.getElementById('mod-badge').classList.add('hidden'); }
            if (unreadFb > 0) { document.getElementById('fb-badge').textContent = unreadFb; document.getElementById('fb-badge').classList.remove('hidden'); } else { document.getElementById('fb-badge').classList.add('hidden'); }
        }

        window.switchView = function(viewName) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const navId = 'nav-' + viewName;
            if (document.getElementById(navId)) document.getElementById(navId).classList.add('active');

            const container = document.getElementById('view-content');
            container.innerHTML = '<div class="text-center py-20"><i class="fa-solid fa-spinner fa-spin text-brand-teal"></i></div>';

            setTimeout(() => {
                if (viewName === 'dashboard') renderDashboard(container);
                if (viewName === 'moderation') renderModeration(container);
                if (viewName === 'feedback') renderFeedback(container);
                if (viewName === 'settings') renderSettings(container);
            }, 100);
        };

        function renderDashboard(container) {
            const publishedArts = allData.articles.filter(a => a.status === 'published').length;
            const pendingArts = allData.articles.filter(a => a.status === 'pending').length;
            const publishedMods = allData.models.filter(m => m.status === 'published').length;
            const unreadFb = allData.feedback.filter(f => !f.is_read).length;

            container.innerHTML = `
                <h1 class="text-3xl font-display font-bold text-white mb-8">Добро пожаловать в CMS</h1>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div class="bg-brand-card p-6 rounded-2xl border border-brand-border"><div class="text-gray-400 text-xs font-bold uppercase mb-1">Статьи (Опубл.)</div><div class="text-3xl font-bold text-white">${publishedArts}</div></div>
                    <div class="bg-brand-card p-6 rounded-2xl border border-brand-border"><div class="text-brand-pending text-xs font-bold uppercase mb-1">Статьи (На модерации)</div><div class="text-3xl font-bold text-white">${pendingArts}</div></div>
                    <div class="bg-brand-card p-6 rounded-2xl border border-brand-border"><div class="text-gray-400 text-xs font-bold uppercase mb-1">3D Модели (Опубл.)</div><div class="text-3xl font-bold text-white">${publishedMods}</div></div>
                    <div class="bg-brand-card p-6 rounded-2xl border border-brand-border"><div class="text-brand-teal text-xs font-bold uppercase mb-1">Новые сообщения</div><div class="text-3xl font-bold text-white">${unreadFb}</div></div>
                </div>
                <div class="bg-gradient-to-r from-blue-900/40 to-brand-card p-8 rounded-3xl border border-blue-500/30">
                    <h2 class="text-xl font-bold text-white mb-2">🚀 Инструменты</h2>
                    <div class="flex flex-wrap gap-4 mt-4">
                        <a href="edit-site.html" class="px-5 py-2.5 bg-brand-teal text-black font-bold text-sm rounded-xl hover:scale-105 transition-all"><i class="fa-solid fa-sliders mr-2"></i> Редактор главной</a>
                        <a href="builder.html" class="px-5 py-2.5 bg-brand-border text-white font-bold text-sm rounded-xl hover:bg-gray-700"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Конструктор</a>
                        <a href="edit-parts.html" class="px-5 py-2.5 bg-brand-border text-white font-bold text-sm rounded-xl hover:bg-gray-700"><i class="fa-solid fa-list-check mr-2"></i> Запчасти</a>
                    </div>
                </div>
            `;
        }

        function renderModeration(container) {
            const pendingArts = allData.articles.filter(a => a.status === 'pending');
            const pendingMods = allData.models.filter(m => m.status === 'pending');
            let html = `<h1 class="text-3xl font-display font-bold text-white mb-8">Модерация</h1><div class="grid grid-cols-1 lg:grid-cols-2 gap-8">`;
            html += `<div><h2 class="text-xl font-bold text-brand-teal mb-4 border-b border-brand-border pb-2">Статьи (${pendingArts.length})</h2>`;
            pendingArts.forEach(a => html += `<div class="bg-brand-card p-4 rounded-xl border border-brand-border mb-3"><h3 class="font-bold text-white">${a.title}</h3><p class="text-xs text-gray-400 mb-3">${a.summary}</p><div class="flex gap-2"><button onclick="approveItem('articles', '${a.id}')" class="px-3 py-1.5 bg-green-500/20 text-green-400 rounded-lg text-xs font-bold">Одобрить</button><button onclick="deleteItem('articles', '${a.id}')" class="px-3 py-1.5 bg-red-500/20 text-red-400 rounded-lg text-xs font-bold">Удалить</button></div></div>`);
            html += `</div><div><h2 class="text-xl font-bold text-brand-teal mb-4 border-b border-brand-border pb-2">3D Модели (${pendingMods.length})</h2>`;
            pendingMods.forEach(m => html += `<div class="bg-brand-card p-4 rounded-xl border border-brand-border mb-3"><h3 class="font-bold text-white">${m.title}</h3><p class="text-xs text-gray-400 mb-3">${m.description}</p><div class="flex gap-2"><button onclick="approveItem('models_3d', '${m.id}')" class="px-3 py-1.5 bg-green-500/20 text-green-400 rounded-lg text-xs font-bold">Одобрить</button><button onclick="deleteItem('models_3d', '${m.id}')" class="px-3 py-1.5 bg-red-500/20 text-red-400 rounded-lg text-xs font-bold">Удалить</button></div></div>`);
            html += `</div></div>`;
            container.innerHTML = html;
        }

        function renderFeedback(container) {
            let html = `<h1 class="text-3xl font-display font-bold text-white mb-8">Обратная связь</h1>`;
            if (allData.feedback.length === 0) html += `<p class="text-gray-500">Сообщений пока нет.</p>`;
            allData.feedback.forEach(f => {
                const isUnread = !f.is_read;
                html += `<div class="bg-brand-card p-5 rounded-2xl border ${isUnread ? 'border-brand-teal/50' : 'border-brand-border'} mb-4"><div class="flex justify-between items-start mb-2"><span class="font-bold text-white">${f.name}</span><span class="text-xs text-gray-500">${new Date(f.created_at).toLocaleString('ru-RU')}</span></div><p class="text-sm text-gray-300 mb-4">${f.message}</p><div class="flex gap-2 items-center">${isUnread ? `<button onclick="markRead('${f.id}')" class="text-xs text-brand-teal hover:underline">Отметить прочитанным</button>` : `<span class="text-xs text-green-500">Прочитано</span>`}<button onclick="deleteItem('feedback', '${f.id}')" class="text-xs text-red-400 hover:underline ml-4">Удалить</button></div></div>`;
            });
            container.innerHTML = html;
        }

        function renderSettings(container) {
            container.innerHTML = `
                <h1 class="text-3xl font-display font-bold text-white mb-8">Настройки сайта</h1>
                <div class="bg-brand-card p-6 rounded-3xl border border-brand-border max-w-3xl">
                    <h2 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-sliders text-brand-teal"></i> Кто может предлагать контент?</h2>
                    <div class="flex flex-col sm:flex-row gap-4">
                        <label class="flex-1 cursor-pointer"><input type="radio" name="publish_mode" value="everyone" class="peer sr-only"><div class="p-4 rounded-2xl border border-brand-border bg-brand-dark peer-checked:border-brand-teal peer-checked:bg-brand-teal/5"><span class="font-bold text-white text-sm">Разрешить всем</span></div></label>
                        <label class="flex-1 cursor-pointer"><input type="radio" name="publish_mode" value="registered" class="peer sr-only"><div class="p-4 rounded-2xl border border-brand-border bg-brand-dark peer-checked:border-brand-teal peer-checked:bg-brand-teal/5"><span class="font-bold text-white text-sm">Только для своих</span></div></label>
                    </div>
                    <div class="mt-6 flex justify-end"><button onclick="saveSettings()" class="px-6 py-2.5 bg-brand-teal text-black font-bold text-sm rounded-xl"><i class="fa-solid fa-floppy-disk"></i> Сохранить</button></div>
                </div>
            `;
            supabase.from('site_settings').select('value').eq('key', 'submission_mode').single().then(({data}) => {
                if (data) { const radio = document.querySelector(`input[name="publish_mode"][value="${data.value}"]`); if (radio) radio.checked = true; }
            });
        }

        window.approveItem = async function(table, id) { await supabase.from(table).update({ status: 'published' }).eq('id', id); await loadAllData(); switchView('moderation'); };
        window.deleteItem = async function(table, id) { const ok = await showConfirm('Удалить запись?', 'Это действие нельзя отменить.'); if (ok) { await supabase.from(table).delete().eq('id', id); await loadAllData(); const activeNav = document.querySelector('.nav-item.active').id; if (activeNav === 'nav-moderation') switchView('moderation'); if (activeNav === 'nav-feedback') switchView('feedback'); } };
        window.markRead = async function(id) { await supabase.from('feedback').update({ is_read: true }).eq('id', id); await loadAllData(); switchView('feedback'); };
        window.saveSettings = async function() { const mode = document.querySelector('input[name="publish_mode"]:checked').value; await supabase.from('site_settings').update({ value: mode }).eq('key', 'submission_mode'); alert('Настройки сохранены!'); };
        window.logout = async function() { await supabase.auth.signOut(); window.location.href = 'index.html'; };

        checkAuth();
    </script>
</body>
</html>
