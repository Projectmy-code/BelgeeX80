<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ-панель — BELGEE X80</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#0c1017] text-white min-h-screen"><main class="max-w-5xl mx-auto p-4 md:p-8"><header class="flex justify-between items-center mb-8"><div><a href="index.html" class="text-cyan-400 text-sm">← Сайт</a><h1 class="text-3xl font-bold mt-2">Панель администратора</h1></div><button id="logout" class="bg-[#253142] rounded-lg px-4 py-2">Выйти</button></header><p id="message" role="status" class="text-cyan-300 mb-4"></p><div id="protected" class="hidden"><section class="bg-[#161e2b] border border-[#253142] rounded-2xl p-5 mb-6"><h2 class="text-xl font-bold mb-3">Кто может отправлять статьи?</h2><div class="flex flex-col sm:flex-row gap-3"><select id="mode" class="bg-[#0c1017] border border-gray-700 rounded-lg p-3 flex-1"><option value="everyone">Все посетители (включая гостей)</option><option value="registered">Только зарегистрированные</option><option value="admin">Только администрация</option></select><button id="save" class="bg-cyan-400 text-black font-bold px-5 py-3 rounded-lg">Сохранить</button></div><p class="text-sm text-gray-400 mt-3">Все отправленные пользователями статьи проходят обязательную модерацию.</p></section><section><h2 class="text-xl font-bold mb-4">Модерация статей</h2><div class="flex gap-2 mb-5"><button data-filter="pending" class="bg-cyan-400 text-black px-3 py-2 rounded-lg">Ожидают</button><button data-filter="published" class="bg-[#253142] px-3 py-2 rounded-lg">Опубликованы</button><button data-filter="rejected" class="bg-[#253142] px-3 py-2 rounded-lg">Отклонены</button><button data-filter="all" class="bg-[#253142] px-3 py-2 rounded-lg">Все</button></div><div id="items" class="space-y-4"></div></section></div></main><script type="module">
import {db,currentUser,adminStatus,submissionMode,escapeHtml} from './js/api.js';const $=id=>document.getElementById(id),msg=s=>$('message').textContent=s;let articles=[],filter='pending';try{if(!db)throw Error('Заполните js/config.js');if(!await currentUser()||!await adminStatus())throw Error('Доступ запрещён: требуется аккаунт администратора.');$('protected').classList.remove('hidden');$('mode').value=await submissionMode();await load();}catch(e){msg(e.message)}
async function load(){const {data,error}=await db.from('articles').select('*').order('created_at',{ascending:false}).limit(500);if(error)return msg(error.message);articles=data||[];render()}
function render(){const rows=articles.filter(a=>filter==='all'||a.status===filter);$('items').innerHTML=rows.map(a=>`<article class="bg-[#161e2b] border border-[#253142] p-5 rounded-xl"><div class="flex justify-between gap-3 text-xs text-cyan-300"><span>${escapeHtml(a.category)} · ${escapeHtml(a.status)}</span><span>${new Date(a.created_at).toLocaleDateString('ru-RU')}</span></div><h3 class="font-bold text-lg my-2">${escapeHtml(a.title)}</h3><p class="text-gray-400 text-sm mb-3">${escapeHtml(a.summary)}</p><p class="text-xs text-gray-400 mb-2">Автор: ${escapeHtml(a.guest_name||'Участник')}</p><details class="mb-4"><summary class="cursor-pointer text-cyan-300">Читать полный текст</summary><div class="whitespace-pre-wrap text-sm mt-3 text-gray-300">${escapeHtml(a.content)}</div></details><div class="flex flex-wrap gap-2">${a.status!=='published'?`<button data-id="${a.id}" data-action="published" class="bg-emerald-600 px-3 py-2 rounded-lg">Одобрить</button>`:''}${a.status!=='rejected'?`<button data-id="${a.id}" data-action="rejected" class="bg-amber-700 px-3 py-2 rounded-lg">Отклонить</button>`:''}<button data-id="${a.id}" data-action="delete" class="bg-red-700 px-3 py-2 rounded-lg">Удалить</button></div></article>`).join('')||'<p class="text-gray-400">Статей нет.</p>'}
$('save').onclick=async()=>{const {error}=await db.from('site_settings').update({value:$('mode').value,updated_at:new Date().toISOString()}).eq('key','submission_mode');msg(error?error.message:'Настройки сохранены!')};
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>{x.className=x===b?'bg-cyan-400 text-black px-3 py-2 rounded-lg':'bg-[#253142] px-3 py-2 rounded-lg'});render()});
$('items').onclick=async e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=b.dataset.id,action=b.dataset.action;if(!confirm(action==='delete'?'Удалить статью без возможности восстановления?':'Подтвердить действие?'))return;let error;if(action==='delete'){({error}=await db.from('articles').delete().eq('id',id))}else{const reason=action==='rejected'?prompt('Причина отклонения (необязательно):')||null:null;({error}=await db.from('articles').update({status:action,rejection_reason:reason,published_at:action==='published'?new Date().toISOString():null}).eq('id',id))}if(error)msg(error.message);else{msg('Готово');await load()}};
$('logout').onclick=async()=>{if(db)await db.auth.signOut();location.href='login.html'};
</script></body></html>
