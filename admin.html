<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — BELGEE X80</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { teal: '#00f0ff', dark: '#0c1017', card: '#161e2b', border: '#253142' } } } } }
    </script>
    <style> body { background-color: #0c1017; color: white; font-family: sans-serif; } </style>
</head>
<body class="min-h-screen p-4 sm:p-8">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-8 border-b border-brand-border pb-4">
            <h1 class="text-2xl font-bold">Панель Администратора</h1>
            <div class="flex gap-4 items-center">
                <a href="index.html" class="text-sm text-brand-teal hover:underline">← На главную</a>
                <button onclick="logout()" class="text-sm text-red-400 hover:underline">Выйти</button>
            </div>
        </div>

        <div id="loading" class="text-center py-20 text-gray-400">Проверка прав доступа...</div>

        <div id="access-denied" class="hidden text-center py-20">
            <h2 class="text-3xl text-red-500 font-bold mb-4">Доступ запрещен</h2>
            <p class="text-gray-400">Вы вошли как <span id="user-email" class="text-white"></span>, но у вас нет прав администратора.</p>
        </div>

        <div id="admin-content" class="hidden space-y-8">
            <div class="bg-brand-card p-6 rounded-2xl border border-brand-border">
                <h2 class="text-lg font-bold mb-4">Настройки публикации</h2>
                <div class="flex items-center gap-4">
                    <select id="publish-mode" class="bg-brand-dark border border-brand-border rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-brand-teal">
                        <option value="all">Разрешить всем (без регистрации)</option>
                        <option value="registered">Только зарегистрированным</option>
                    </select>
                    <button onclick="saveSettings()" class="px-4 py-2 bg-brand-teal text-black font-bold text-sm rounded-lg hover:opacity-90">Сохранить</button>
                </div>
            </div>

            <div class="bg-brand-card p-6 rounded-2xl border border-brand-border">
                <h2 class="text-lg font-bold mb-4">Статьи на модерации</h2>
                <div id="pending-articles" class="space-y-4">
                    <p class="text-gray-400 text-sm">Загрузка...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase.js';

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            document.getElementById('loading').classList.add('hidden');

            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('user-email').textContent = session.user.email;

            // Проверка по ID (UUID)
            const { data: adminData } = await supabase
                .from('admins')
                .select('user_id')
                .eq('user_id', session.user.id)
                .maybeSingle();

            if (!adminData) {
                document.getElementById('access-denied').classList.remove('hidden');
                return;
            }

            document.getElementById('admin-content').classList.remove('hidden');
            await loadSettings();
            await loadPendingArticles();
        }

        async function loadSettings() {
            const { data } = await supabase.from('site_settings').select('publish_mode').eq('id', 1).single();
            if (data) document.getElementById('publish-mode').value = data.publish_mode;
        }

        window.saveSettings = async function() {
            const mode = document.getElementById('publish-mode').value;
            const { error } = await supabase.from('site_settings').update({ publish_mode: mode }).eq('id', 1);
            if (error) alert('Ошибка: ' + error.message);
            else alert('Настройки сохранены!');
        }

        async function loadPendingArticles() {
            const { data: articles } = await supabase.from('articles').select('*').eq('status', 'pending').order('created_at', { ascending: false });
            const container = document.getElementById('pending-articles');
            
            if (!articles || articles.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-sm">Нет статей на модерации.</p>';
                return;
            }

            container.innerHTML = '';
            articles.forEach((article) => {
                const div = document.createElement('div');
                div.className = 'border border-brand-border p-4 rounded-xl bg-brand-dark';
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-bold text-white">${article.title}</h3>
                        <span class="text-xs text-brand-teal">${article.author}</span>
                    </div>
                    <p class="text-sm text-gray-400 mb-4">${article.summary}</p>
                    <div class="flex gap-2">
                        <button onclick="approveArticle('${article.id}')" class="px-3 py-1.5 bg-green-500/20 text-green-400 border border-green-500/30 rounded-lg text-xs hover:bg-green-500/30">Одобрить</button>
                        <button onclick="deleteArticle('${article.id}')" class="px-3 py-1.5 bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg text-xs hover:bg-red-500/30">Удалить</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.approveArticle = async function(id) {
            await supabase.from('articles').update({ status: 'published' }).eq('id', id);
            loadPendingArticles();
        }

        window.deleteArticle = async function(id) {
            if(confirm('Удалить статью?')) {
                await supabase.from('articles').delete().eq('id', id);
                loadPendingArticles();
            }
        }

        window.logout = async function() {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        checkAuth();
    </script>
</body>
</html>
