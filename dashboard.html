<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный экран — BELGEE X80</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { teal: '#00f0ff', dark: '#0c1017', card: '#161e2b', border: '#253142' } }, fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Montserrat', 'sans-serif'] } } } }
    </script>
    <style>
        body { background-color: #0c1017; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(22, 30, 43, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .hotspot { position: absolute; border: 2px solid transparent; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; background: rgba(0, 240, 255, 0); z-index: 10; display: flex; align-items: center; justify-content: center; }
        .hotspot:hover, .hotspot.active { background: rgba(0, 240, 255, 0.15); border-color: #00f0ff; box-shadow: 0 0 20px rgba(0, 240, 255, 0.3) inset; }
        .hotspot-label { opacity: 0; transform: translateY(5px); transition: all 0.3s ease; background: rgba(0,0,0,0.8); color: #00f0ff; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; pointer-events: none; border: 1px solid rgba(0, 240, 255, 0.3); text-align: center; }
        .hotspot:hover .hotspot-label, .hotspot.active .hotspot-label { opacity: 1; transform: translateY(0); }
        .screen-tab { transition: all 0.2s ease; border-bottom: 2px solid transparent; }
        .screen-tab.active { color: #00f0ff; border-bottom-color: #00f0ff; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

    <header class="sticky top-0 z-50 glass-panel border-b border-brand-border/60">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-3 group shrink-0">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-brand-teal flex items-center justify-center shadow-lg"><span class="font-display font-black text-black text-xl">X</span></div>
                <div><div class="font-display font-black text-xl text-white">BELGEE <span class="text-brand-teal">X80</span></div><div class="text-[10px] text-gray-400 uppercase">Интерактивный гид</div></div>
            </a>
            <a href="index.html" class="text-sm font-medium text-brand-teal hover:text-white"><i class="fa-solid fa-arrow-left mr-1"></i> На главную</a>
        </div>
    </header>

    <main class="flex-1 py-8">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-display font-bold text-white mb-2">Экран автомобиля</h1>
                <p class="text-gray-400 text-sm">Нажмите на любую подсвеченную зону, чтобы узнать её назначение.</p>
            </div>

            <!-- ВКЛАДКИ -->
            <div class="flex overflow-x-auto border-b border-brand-border mb-6 hide-scrollbar" id="tabs-container">
                <!-- Заполняется скриптом -->
            </div>

            <!-- ЭКРАН -->
            <div id="screen-container" class="relative w-full rounded-2xl overflow-hidden border-4 border-[#161e2b] shadow-2xl bg-black flex items-center justify-center min-h-[300px]">
                <div class="text-brand-teal text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Загрузка...</div>
            </div>

            <div class="mt-6 flex justify-center gap-4 text-xs text-gray-500">
                <div class="flex items-center gap-2"><div class="w-3 h-3 rounded bg-brand-teal/20 border border-brand-teal"></div> Зона клика</div>
            </div>
        </div>
    </main>

    <!-- МОДАЛКА -->
    <div id="info-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div class="bg-brand-card w-full max-w-md rounded-3xl border border-brand-border p-6 shadow-2xl relative" id="modal-content">
            <button onclick="closeModal()" class="absolute top-5 right-5 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            <div class="w-12 h-12 rounded-xl bg-brand-teal/10 border border-brand-teal/20 text-brand-teal flex items-center justify-center text-xl mb-4"><i class="fa-solid fa-lightbulb"></i></div>
            <h2 class="text-xl font-display font-bold text-white mb-2" id="modal-title">Заголовок</h2>
            <p class="text-sm text-gray-300 leading-relaxed" id="modal-desc">Описание...</p>
            <div class="mt-6 pt-4 border-t border-brand-border/60 flex justify-end"><button onclick="closeModal()" class="px-5 py-2 bg-brand-teal text-black font-bold text-sm rounded-lg">Понятно</button></div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/config.js';
        
        let screensData = [];
        let activeScreen = null;

        async function loadScreens() {
            const { data, error } = await supabase.from('dashboard_screens').select('*').order('sort_order');
            if (error) return;
            screensData = data || [];
            
            if (screensData.length > 0) {
                renderTabs();
                selectScreen(screensData[0].id);
            } else {
                document.getElementById('screen-container').innerHTML = '<div class="text-gray-500">Экраны не найдены</div>';
            }
        }

        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = screensData.map((s, i) => `
                <button onclick="selectScreen('${s.id}', this)" class="screen-tab ${i === 0 ? 'active' : ''} px-4 py-4 text-sm font-semibold text-gray-400 whitespace-nowrap">
                    ${s.title}
                </button>
            `).join('');
        }

        window.selectScreen = async function(id, btnElement) {
            // Обновляем кнопки
            if (btnElement) {
                document.querySelectorAll('.screen-tab').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }

            activeScreen = screensData.find(s => s.id === id);
            const container = document.getElementById('screen-container');
            
            if (!activeScreen || !activeScreen.image_url) {
                container.innerHTML = '<div class="text-gray-500 text-sm">Для этого экрана еще не загружено фото.</div>';
                return;
            }

            // Обновляем DOM
            container.innerHTML = `<img src="${activeScreen.image_url}" class="absolute inset-0 w-full h-full object-cover" alt="${activeScreen.title}">`;
            
            const layer = document.createElement('div');
            layer.className = 'absolute inset-0';
            
            const hotspots = activeScreen.hotspots || [];
            hotspots.forEach(hs => {
                const box = document.createElement('div');
                box.className = 'hotspot';
                box.style.top = hs.top + '%';
                box.style.left = hs.left + '%';
                box.style.width = hs.width + '%';
                box.style.height = hs.height + '%';
                box.onclick = (e) => {
                    e.stopPropagation();
                    document.querySelectorAll('.hotspot').forEach(h => h.classList.remove('active'));
                    box.classList.add('active');
                    openModal(hs.title, hs.desc);
                };
                box.innerHTML = hs.title ? `<span class="hotspot-label">${hs.title}</span>` : '';
                layer.appendChild(box);
            });
            
            container.appendChild(layer);
        }

        window.openModal = function(title, desc) {
            document.getElementById('modal-title').textContent = title || 'Информация';
            document.getElementById('modal-desc').textContent = desc || 'Описание отсутствует.';
            document.getElementById('info-modal').classList.remove('hidden');
            document.getElementById('modal-content').classList.add('scale-100');
            document.getElementById('modal-content').classList.remove('scale-95');
        }

        window.closeModal = function() {
            document.getElementById('info-modal').classList.add('hidden');
            document.querySelectorAll('.hotspot').forEach(h => h.classList.remove('active'));
        }

        document.getElementById('info-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        loadScreens();
    </script>
</body>
</html>
