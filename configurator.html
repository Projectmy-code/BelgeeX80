<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BELGEE X80 PHEV — 3D Конфигуратор</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- Шрифт как на сайте -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root {
            --bg: #0c1017;
            --panel-bg: rgba(22, 30, 43, 0.85);
            --panel-border: rgba(0, 240, 255, 0.15);
            --text: #e2e8f0;
            --text-secondary: #9ca3af;
            --accent: #00f0ff;
            --radius: 18px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: var(--font);
            background: radial-gradient(circle at center, #1e293b 0%, #0c1017 70%);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        body { display: flex; flex-direction: column; }

        /* ---------- Верхняя панель ---------- */
        .top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 10;
            padding: 24px 36px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }
        .brand h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: #fff;
            text-transform: uppercase;
        }
        .brand p {
            font-size: 14px;
            color: var(--accent);
            margin-top: 4px;
            font-weight: 600;
        }
        .back-btn {
            pointer-events: auto;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            transition: all 0.2s;
        }
        .back-btn:hover { color: var(--accent); border-color: var(--accent); }

        /* ---------- 3D Viewport ---------- */
        #viewport {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #viewport canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            outline: none;
            touch-action: none;
        }

        /* ---------- Нижняя панель ---------- */
        .bottom-panel {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            z-index: 10;
            padding: 18px 36px 28px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: linear-gradient(to top, rgba(12, 16, 23, 0.98) 60%, transparent);
            pointer-events: none;
        }
        .bottom-panel > * { pointer-events: auto; }

        .color-section {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
            padding: 12px 18px;
            box-shadow: var(--shadow);
            width: fit-content;
        }
        .section-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .color-swatches { display: flex; gap: 8px; }
        .swatch {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }
        .swatch:hover { transform: scale(1.12); }
        .swatch.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.3);
        }
        .color-name {
            font-size: 14px;
            font-weight: 600;
            min-width: 120px;
            color: #fff;
        }

        .controls-section {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .control-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 999px;
            border: 1px solid var(--panel-border);
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow);
            font-family: var(--font);
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
        }
        .control-btn:hover { background: rgba(0, 240, 255, 0.1); border-color: var(--accent); transform: translateY(-1px); }
        .control-btn[aria-pressed="true"] { background: var(--accent); color: #000; border-color: var(--accent); }
        .control-btn .icon { font-size: 16px; }

        .view-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .view-btn {
            padding: 10px 16px;
            border-radius: 999px;
            border: 1px solid var(--panel-border);
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow);
            font-family: var(--font);
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .view-btn:hover { background: rgba(0, 240, 255, 0.1); border-color: var(--accent); transform: translateY(-1px); }
        .view-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

        /* ---------- Загрузка и Ошибки ---------- */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        #loader.hidden { opacity: 0; visibility: hidden; }
        .loader-content { text-align: center; }
        .loader-spinner {
            width: 36px; height: 36px;
            margin: 0 auto 20px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text { font-size: 15px; color: var(--text-secondary); margin-bottom: 16px; }
        .loader-bar {
            width: 200px; height: 4px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .loader-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        #error-screen {
            position: fixed;
            inset: 0;
            z-index: 110;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            padding: 24px;
        }
        #error-screen.hidden { display: none; }
        .error-content { max-width: 480px; text-align: center; }
        .error-content h2 { font-size: 22px; margin-bottom: 12px; color: #fff; }
        .error-content p { font-size: 15px; color: var(--text-secondary); line-height: 1.5; }
        .error-hint { margin-top: 16px; font-size: 13px; }
        .error-hint code {
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            color: var(--accent);
        }

        @media (max-width: 700px) {
            .top-bar { padding: 18px 20px; }
            .brand h1 { font-size: 17px; }
            .brand p { font-size: 13px; }
            .bottom-panel { padding: 14px 16px 20px; gap: 10px; }
            .color-section { padding: 10px 14px; gap: 10px; }
            .color-name { min-width: 70px; font-size: 13px; }
            .swatch { width: 28px; height: 28px; }
            .controls-section { gap: 8px; }
            .control-btn, .view-btn { padding: 8px 12px; font-size: 12px; }
            .view-buttons { gap: 6px; }
        }
    </style>
</head>
<body>
    <!-- Экран загрузки -->
    <div id="loader">
        <div class="loader-content">
            <div class="loader-spinner"></div>
            <p class="loader-text">Загрузка автомобиля…</p>
            <div class="loader-bar"><div class="loader-bar-fill" id="loader-bar-fill"></div></div>
        </div>
    </div>

    <!-- Экран ошибки -->
    <div id="error-screen" class="hidden">
        <div class="error-content">
            <h2>Не удалось загрузить 3D-модель</h2>
            <p id="error-message">Файл не найден.</p>
            <p class="error-hint">Убедитесь, что файл <code>models/car.glb</code> существует в папке с сайтом.</p>
        </div>
    </div>

    <!-- Шапка -->
    <header class="top-bar">
        <div class="brand">
            <h1>BELGEE X80 PHEV</h1>
            <p>Создай свой автомобиль</p>
        </div>
        <a href="index.html" class="back-btn">← На главную</a>
    </header>

    <!-- 3D Сцена -->
    <main id="viewport"></main>

    <!-- Нижняя панель управления -->
    <footer class="bottom-panel">
        <div class="color-section">
            <span class="section-label">Цвет кузова</span>
            <div class="color-swatches" id="color-swatches"></div>
            <span class="color-name" id="color-name">A08 · Crystal White</span>
        </div>

        <div class="controls-section">
            <button id="btn-rotate" class="control-btn" aria-pressed="false">
                <span class="icon">⟳</span> Авто-вращение
            </button>

            <div class="view-buttons" id="view-buttons">
                <button class="view-btn" data-view="front">Спереди</button>
                <button class="view-btn" data-view="rear">Сзади</button>
                <button class="view-btn" data-view="left">Левый бок</button>
                <button class="view-btn" data-view="right">Правый бок</button>
                <button class="view-btn" data-view="front-left">Передний левый</button>
                <button class="view-btn" data-view="front-right">Передний правый</button>
            </div>
        </div>
    </footer>

    <!-- Скрипт логики конфигуратора -->
    <script type="module" src="app.js"></script>
</body>
</html>
