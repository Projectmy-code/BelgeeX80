<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#161e2b"/>
  <defs>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <!-- Внешняя шина -->
  <circle cx="50" cy="50" r="35" stroke="url(#wheelGrad)" stroke-width="8" fill="none"/>
  <!-- Внутренний диск -->
  <circle cx="50" cy="50" r="15" stroke="#253142" stroke-width="6" fill="none"/>
  <!-- Спицы -->
  <line x1="50" y1="15" x2="50" y2="35" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  <line x1="50" y1="65" x2="50" y2="85" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  <line x1="15" y1="50" x2="35" y2="50" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  <line x1="65" y1="50" x2="85" y2="50" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
</svg>
