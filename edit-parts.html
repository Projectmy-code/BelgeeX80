<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление каталогом — BELGEE X80</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { teal: '#00f0ff', dark: '#0c1017', card: '#161e2b', border: '#253142' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style> body { background-color: #0c1017; color: #e2e8f0; font-family: 'Inter', sans-serif; } </style>
</head>
<body class="min-h-screen py-10 px-4">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8 border-b border-brand-border pb-4">
            <div>
                <h1 class="text-2xl font-bold text-white">Каталог запчастей</h1>
                <p class="text-sm text-gray-400">Добавление и редактирование артикулов</p>
            </div>
            <div class="flex gap-3">
                <a href="admin.html" class="px-4 py-2 bg-brand-card border border-brand-border text-white text-sm rounded-lg hover:bg-brand-border transition-colors">Назад</a>
                <button onclick="openModal()" class="px-4 py-2 bg-brand-teal text-black font-bold text-sm rounded-lg hover:scale-105 transition-all"><i class="fa-solid fa-plus mr-1"></i> Добавить</button>
            </div>
        </div>

        <div class="bg-brand-card rounded-2xl border border-brand-border overflow-x-auto">
            <table class="w-full text-left text-sm min-w-max">
                <thead class="bg-brand-dark text-gray-400 text-xs uppercase border-b border-brand-border">
                    <tr>
                        <th class="p-4">Название</th>
                        <th class="p-4">Категория</th>
                        <th class="p-4">Артикул</th>
                        <th class="p-4 text-center">Действия</th>
                    </tr>
                </thead>
                <tbody id="parts-table" class="divide-y divide-brand-border/40">
                    <tr><td colspan="4" class="p-6 text-center text-gray-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДЛЯ ДОБАВЛЕНИЯ/РЕДАКТИРОВАНИЯ -->
    <div id="part-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div class="bg-brand-card w-full max-w-lg rounded-3xl border border-brand-border p-6 shadow-2xl relative">
            <button onclick="toggleModal()" class="absolute top-5 right-5 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h2 id="modal-title" class="text-xl font-bold text-white mb-4">Добавить запчасть</h2>
            
            <form id="part-form" onsubmit="savePart(event)" class="space-y-4">
                <input type="hidden" id="part-id">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Название</label>
                    <input type="text" id="part-name" required class="w-full bg-brand-dark border border-brand-border rounded-xl px-4 py-2 text-sm text-white focus:border-brand-teal outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Категория</label>
                        <select id="part-category" class="w-full bg-brand-dark border border-brand-border rounded-xl px-4 py-2 text-sm text-white focus:border-brand-teal outline-none">
                            <option value="oils">Моторные масла</option>
                            <option value="filters">Фильтры</option>
                            <option value="spark">Свечи</option>
                            <option value="transmission">КПП/Редуктор</option>
                            <option value="fluids">Техжидкости</option>
                            <option value="wheels">Колёса</option>
                            <option value="wipers">Щётки</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Регламент</label>
                        <input type="text" id="part-interval" placeholder="10 000 км" class="w-full bg-brand-dark border border-brand-border rounded-xl px-4 py-2 text-sm text-white focus:border-brand-teal outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">OEM Артикул</label>
                    <input type="text" id="part-oem" required class="w-full bg-brand-dark border border-brand-border rounded-xl px-4 py-2 text-sm text-white focus:border-brand-teal outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Аналоги / Примечание</label>
                    <input type="text" id="part-analog" class="w-full bg-brand-dark border border-brand-border rounded-xl px-4 py-2 text-sm text-white focus:border-brand-teal outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Цена (опционально)</label>
                    <input type="text" id="part-price" placeholder="~100 BYN" class="w-full bg-brand-dark border border-brand-border rounded-xl px-4 py-2 text-sm text-white focus:border-brand-teal outline-none">
                </div>
                <button type="submit" id="save-btn" class="w-full py-3 bg-brand-teal text-black font-bold rounded-xl shadow-lg hover:opacity-90 transition-opacity">
                    Сохранить
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/config.js';

        let currentParts = [];

        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            const { data: adminData } = await supabase.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
            if (!adminData) { window.location.href = 'index.html'; return; }

            await loadParts();
        }

        async function loadParts() {
            const { data, error } = await supabase.from('parts').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('parts-table');
            
            if (error) { 
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-red-400 text-center">Ошибка загрузки</td></tr>`;
                return; 
            }
            
            currentParts = data || [];
            
            if (currentParts.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-gray-500">В каталоге пока нет запчастей</td></tr>`;
                return;
            }

            tbody.innerHTML = currentParts.map(part => `
                <tr class="hover:bg-brand-border/30 transition-colors">
                    <td class="p-4 font-semibold text-white">${part.name}</td>
                    <td class="p-4 text-xs text-brand-teal uppercase">${part.category}</td>
                    <td class="p-4 text-xs font-mono text-gray-300">${part.oem}</td>
                    <td class="p-4 text-center whitespace-nowrap">
                        <button onclick="editPart('${part.id}')" class="p-2 text-brand-teal hover:text-white transition-colors" title="Редактировать"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deletePart('${part.id}')" class="p-2 text-red-400 hover:text-red-300 transition-colors" title="Удалить"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        window.toggleModal = () => document.getElementById('part-modal').classList.toggle('hidden');

        window.openModal = () => {
            document.getElementById('part-form').reset();
            document.getElementById('part-id').value = '';
            document.getElementById('modal-title').textContent = 'Добавить запчасть';
            toggleModal();
        };

        window.editPart = (id) => {
            const part = currentParts.find(p => p.id === id);
            if (!part) return;
            
            document.getElementById('part-id').value = part.id;
            document.getElementById('part-name').value = part.name;
            document.getElementById('part-category').value = part.category;
            document.getElementById('part-interval').value = part.interval || '';
            document.getElementById('part-oem').value = part.oem;
            document.getElementById('part-analog').value = part.analog || '';
            document.getElementById('part-price').value = part.price || '';
            
            document.getElementById('modal-title').textContent = 'Редактировать запчасть';
            toggleModal();
        };

        window.savePart = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            btn.textContent = 'Сохранение...';
            btn.disabled = true;

            const id = document.getElementById('part-id').value;
            const partData = {
                name: document.getElementById('part-name').value,
                category: document.getElementById('part-category').value,
                interval: document.getElementById('part-interval').value,
                oem: document.getElementById('part-oem').value,
                analog: document.getElementById('part-analog').value,
                price: document.getElementById('part-price').value,
            };

            let error;
            if (id) {
                const res = await supabase.from('parts').update(partData).eq('id', id);
                error = res.error;
            } else {
                const res = await supabase.from('parts').insert([partData]);
                error = res.error;
            }

            btn.textContent = 'Сохранить';
            btn.disabled = false;

            if (error) {
                alert('Ошибка: ' + error.message);
            } else {
                toggleModal();
                await loadParts();
            }
        };

        window.deletePart = async (id) => {
            if (confirm('Удалить этот артикул?')) {
                const { error } = await supabase.from('parts').delete().eq('id', id);
                if (error) alert('Ошибка: ' + error.message);
                else await loadParts();
            }
        };

        init();
    </script>
</body>
</html>
