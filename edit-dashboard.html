<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор экрана — BELGEE X80</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { teal: '#00f0ff', dark: '#0c1017', card: '#161e2b', border: '#253142' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>
        body { background-color: #0c1017; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .draw-container { position: relative; user-select: none; touch-action: none; }
        .draw-container img { width: 100%; height: auto; display: block; pointer-events: none; }
        .hotspot-box { 
            position: absolute; 
            border: 2px solid #00f0ff; 
            background: rgba(0, 240, 255, 0.2); 
            cursor: move; 
            display: flex; 
            align-items: flex-start; 
            justify-content: flex-end; 
            padding: 4px; 
        }
        .hotspot-box .del-btn { background: #ef4444; color: white; border-radius: 4px; padding: 4px 6px; font-size: 10px; cursor: pointer; pointer-events: auto; }
        .hotspot-box .edit-btn { background: #00f0ff; color: black; border-radius: 4px; padding: 4px 6px; font-size: 10px; cursor: pointer; margin-right: 4px; pointer-events: auto; }
    </style>
</head>
<body class="min-h-screen py-10 px-4">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6 border-b border-brand-border pb-4">
            <div>
                <h1 class="text-2xl font-bold text-white">Редактор экранов</h1>
                <p class="text-sm text-gray-400">Загружайте фото и рисуйте зоны кликов мышкой</p>
            </div>
            <a href="admin.html" class="text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left mr-1"></i> В админку</a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- Левая панель: Выбор экрана -->
            <div class="space-y-2">
                <button onclick="selectScreen('home', this)" class="screen-btn w-full text-left px-4 py-2 rounded-lg bg-brand-teal text-black font-bold border border-brand-teal" data-screen="home">Главный экран</button>
                <button onclick="selectScreen('roof', this)" class="screen-btn w-full text-left px-4 py-2 rounded-lg bg-brand-card border border-brand-border text-white" data-screen="roof">Шторка и люк</button>
                <button onclick="selectScreen('audio', this)" class="screen-btn w-full text-left px-4 py-2 rounded-lg bg-brand-card border border-brand-border text-white" data-screen="audio">Звук</button>
                <button onclick="selectScreen('settings', this)" class="screen-btn w-full text-left px-4 py-2 rounded-lg bg-brand-card border border-brand-border text-white" data-screen="settings">Настройки</button>
                <button onclick="selectScreen('apps', this)" class="screen-btn w-full text-left px-4 py-2 rounded-lg bg-brand-card border border-brand-border text-white" data-screen="apps">Приложения</button>
            </div>

            <!-- Правая панель: Рабочая область -->
            <div class="lg:col-span-3">
                
                <!-- БЛОК ЗАГРУЗКИ ФОТО -->
                <div class="bg-brand-card p-4 rounded-xl border border-brand-border mb-4">
                    <div class="flex flex-col sm:flex-row items-center gap-4">
                        <!-- Кнопка загрузки файла -->
                        <label class="w-full sm:w-auto px-5 py-3 bg-brand-teal text-black font-bold text-sm rounded-lg cursor-pointer hover:scale-105 transition-transform flex items-center justify-center gap-2 shrink-0">
                            <i class="fa-solid fa-cloud-arrow-up"></i> Загрузить с устройства
                            <input type="file" id="screen-image-file" accept="image/*" class="hidden" onchange="uploadScreenImage(event)">
                        </label>

                        <div class="text-xs text-gray-500 font-bold uppercase tracking-wider">или</div>

                        <!-- Поле для ввода URL -->
                        <div class="flex-1 w-full flex gap-2">
                            <input type="text" id="screen-image-url" placeholder="Вставить URL вручную..." class="flex-1 w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-brand-teal">
                            <button onclick="updateImageFromUrl()" class="px-4 py-2.5 bg-brand-border text-white font-semibold rounded-lg text-sm hover:bg-gray-700 transition-colors shrink-0">Применить</button>
                        </div>
                    </div>
                </div>

                <div class="bg-brand-card rounded-xl border border-brand-border overflow-hidden">
                    <div class="p-3 bg-brand-dark border-b border-brand-border flex flex-col sm:flex-row justify-between items-center gap-2">
                        <span class="text-xs text-gray-400"><i class="fa-solid fa-mouse-pointer mr-1"></i> Зажми мышь (или палец) на фото и тяни, чтобы нарисовать зону</span>
                        <button onclick="saveToDB()" id="save-btn" class="w-full sm:w-auto px-6 py-2 bg-green-500 text-black font-bold rounded-lg text-xs hover:bg-green-400">Сохранить всё</button>
                    </div>
                    <div id="canvas-area" class="draw-container bg-black min-h-[400px] flex items-center justify-center text-gray-500">
                        Выберите экран слева
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка -->
    <div id="edit-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-black/80 p-4">
        <div class="bg-brand-card w-full max-w-sm rounded-2xl border border-brand-border p-6 shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-4">Настройка зоны</h3>
            <div class="space-y-3">
                <div><label class="text-xs text-gray-400">Заголовок</label><input type="text" id="hs-title" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-sm text-white"></div>
                <div><label class="text-xs text-gray-400">Описание</label><textarea id="hs-desc" rows="3" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-sm text-white"></textarea></div>
            </div>
            <div class="flex gap-2 mt-6">
                <button onclick="closeModal()" class="flex-1 py-2 bg-brand-border text-white rounded-lg font-semibold text-sm">Отмена</button>
                <button onclick="saveHotspot()" class="flex-1 py-2 bg-brand-teal text-black rounded-lg font-bold text-sm">Готово</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/config.js';
        
        let currentScreenId = null;
        let currentHotspots = [];
        let currentImageUrl = null;
        let editingHotspotIndex = null;

        // Проверка админа
        async function checkAdmin() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            const { data: isAdmin } = await supabase.rpc('is_admin');
            if (!isAdmin) { window.location.href = 'index.html'; return; }
            selectScreen('home', document.querySelector('[data-screen="home"]'));
        }

        // Переключение экранов
        window.selectScreen = async function(id, btn) {
            currentScreenId = id;
            
            // Визуал кнопок
            document.querySelectorAll('.screen-btn').forEach(b => {
                b.className = 'screen-btn w-full text-left px-4 py-2 rounded-lg bg-brand-card border border-brand-border text-white';
            });
            btn.className = 'screen-btn w-full text-left px-4 py-2 rounded-lg bg-brand-teal text-black font-bold border border-brand-teal';

            // Загрузка из БД
            const { data, error } = await supabase.from('dashboard_screens').select('*').eq('id', id).single();
            if (data) {
                currentImageUrl = data.image_url || '';
                document.getElementById('screen-image-url').value = currentImageUrl;
                currentHotspots = data.hotspots || [];
                renderCanvas();
            }
        }

        // ЗАГРУЗКА ФОТО ИЗ БРАУЗЕРА
        window.uploadScreenImage = async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const label = e.target.parentElement;
            const originalHTML = label.innerHTML;
            label.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Загрузка...';

            try {
                // 1. Формируем имя файла
                const fileExt = file.name.split('.').pop();
                const fileName = `screen_${currentScreenId}_${Date.now()}.${fileExt}`;

                // 2. Загружаем в Supabase Storage (бакет 'images')
                const { error: uploadError } = await supabase.storage.from('images').upload(fileName, file);
                if (uploadError) throw uploadError;

                // 3. Получаем публичный URL
                const { data: urlData } = supabase.storage.from('images').getPublicUrl(fileName);
                const publicUrl = urlData.publicUrl;

                // 4. Сохраняем в БД
                await supabase.from('dashboard_screens').update({ image_url: publicUrl }).eq('id', currentScreenId);
                
                // 5. Обновляем интерфейс
                currentImageUrl = publicUrl;
                document.getElementById('screen-image-url').value = publicUrl;
                currentHotspots = []; // Сбрасываем старые зоны, так как фото новое
                renderCanvas();
                
                alert('Фото успешно загружено!');

            } catch (err) {
                alert('Ошибка загрузки: ' + err.message);
            } finally {
                label.innerHTML = originalHTML;
                e.target.value = ''; // Сбрасываем input
            }
        }

        // ЗАГРУЗКА ПО ССЫЛКЕ (вручную)
        window.updateImageFromUrl = async function() {
            const url = document.getElementById('screen-image-url').value.trim();
            if (!url) return;
            
            await supabase.from('dashboard_screens').update({ image_url: url }).eq('id', currentScreenId);
            currentImageUrl = url;
            currentHotspots = []; // Сбрасываем старые зоны
            renderCanvas();
        }

        // Отрисовка холста
        function renderCanvas() {
            const container = document.getElementById('canvas-area');
            if (!currentImageUrl) {
                container.innerHTML = '<div class="text-gray-500 text-sm text-center px-4">Нет фото. Загрузите с устройства или вставьте ссылку выше.</div>';
                return;
            }

            container.innerHTML = '';
            
            const img = document.createElement('img');
            img.src = currentImageUrl;
            img.id = 'base-image';
            container.appendChild(img);

            const layer = document.createElement('div');
            layer.className = 'absolute inset-0';
            layer.id = 'boxes-layer';
            container.appendChild(layer);

            // Рисуем существующие зоны
            currentHotspots.forEach((hs, index) => {
                const box = document.createElement('div');
                box.className = 'hotspot-box';
                box.style.top = hs.top + '%';
                box.style.left = hs.left + '%';
                box.style.width = hs.width + '%';
                box.style.height = hs.height + '%';
                
                // Защита от проваливания кликов
                box.onmousedown = (e) => e.stopPropagation();
                box.ontouchstart = (e) => e.stopPropagation();
                
                box.innerHTML = `
                    <div class="flex gap-1">
                        <button class="edit-btn" onclick="openModal(${index})"><i class="fa-solid fa-pen"></i></button>
                        <button class="del-btn" onclick="deleteHotspot(${index})"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                layer.appendChild(box);
            });

            initDrawing(container, layer);
        }

        // Логика рисования (Работает и для мыши, и для тача)
        function initDrawing(container, layer) {
            let isDrawing = false;
            let startX, startY, tempBox = null;

            const startDraw = (e) => {
                if (e.target.closest('.hotspot-box')) return;
                e.preventDefault();
                
                const rect = container.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                startX = ((clientX - rect.left) / rect.width) * 100;
                startY = ((clientY - rect.top) / rect.height) * 100;

                tempBox = document.createElement('div');
                tempBox.className = 'hotspot-box';
                tempBox.style.borderStyle = 'dashed';
                layer.appendChild(tempBox);
                isDrawing = true;
            };

            const moveDraw = (e) => {
                if (!isDrawing || !tempBox) return;
                e.preventDefault();

                const rect = container.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const curX = ((clientX - rect.left) / rect.width) * 100;
                const curY = ((clientY - rect.top) / rect.height) * 100;

                const top = Math.min(startY, curY);
                const left = Math.min(startX, curX);
                const width = Math.abs(curX - startX);
                const height = Math.abs(curY - startY);

                tempBox.style.top = top + '%';
                tempBox.style.left = left + '%';
                tempBox.style.width = width + '%';
                tempBox.style.height = height + '%';
            };

            const endDraw = (e) => {
                if (!isDrawing || !tempBox) return;
                isDrawing = false;

                const rect = container.getBoundingClientRect();
                const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

                const curX = ((clientX - rect.left) / rect.width) * 100;
                const curY = ((clientY - rect.top) / rect.height) * 100;
                
                const top = Math.min(startY, curY);
                const left = Math.min(startX, curX);
                const width = Math.abs(curX - startX);
                const height = Math.abs(curY - startY);

                tempBox.remove();

                if (width < 2 || height < 2) return; // Слишком маленькая зона

                currentHotspots.push({ top, left, width, height, title: '', desc: '' });
                editingHotspotIndex = currentHotspots.length - 1;
                renderCanvas();
                openModal(editingHotspotIndex);
            };

            // Привязка событий
            container.addEventListener('mousedown', startDraw);
            window.addEventListener('mousemove', moveDraw);
            window.addEventListener('mouseup', endDraw);

            container.addEventListener('touchstart', startDraw, {passive: false});
            window.addEventListener('touchmove', moveDraw, {passive: false});
            window.addEventListener('touchend', endDraw);
        }

        window.deleteHotspot = function(index) {
            if(confirm('Удалить эту зону?')) {
                currentHotspots.splice(index, 1);
                renderCanvas();
            }
        }

        window.openModal = function(index) {
            editingHotspotIndex = index;
            document.getElementById('hs-title').value = currentHotspots[index].title || '';
            document.getElementById('hs-desc').value = currentHotspots[index].desc || '';
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        window.closeModal = function() {
            document.getElementById('edit-modal').classList.add('hidden');
            editingHotspotIndex = null;
        }

        window.saveHotspot = function() {
            if (editingHotspotIndex === null) return;
            currentHotspots[editingHotspotIndex].title = document.getElementById('hs-title').value;
            currentHotspots[editingHotspotIndex].desc = document.getElementById('hs-desc').value;
            closeModal();
            renderCanvas();
        }

        window.saveToDB = async function() {
            const btn = document.getElementById('save-btn');
            btn.textContent = 'Сохранение...';
            btn.disabled = true;

            const { error } = await supabase.from('dashboard_screens').update({ hotspots: currentHotspots }).eq('id', currentScreenId);
            
            btn.textContent = 'Сохранить всё';
            btn.disabled = false;
            if (error) alert('Ошибка: ' + error.message);
            else alert('Зоны успешно сохранены!');
        }

        checkAdmin();
    </script>
</body>
</html>
