<!DOCTYPE html>
<html lang="ru" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор страниц — BELGEE X80</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { teal: '#00f0ff', dark: '#0c1017', card: '#161e2b', border: '#253142', accent: '#10b981', blue: '#2563eb' } }, fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Montserrat', 'sans-serif'] } } } }
    </script>
    <style>
        body { background-color: #0c1017; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Montserrat', sans-serif; }
        .glass-panel { background: rgba(22, 30, 43, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .ql-toolbar.ql-snow { border-color: #253142 !important; background-color: #0c1017; border-radius: 12px 12px 0 0; }
        .ql-container.ql-snow { border-color: #253142 !important; background-color: #0c1017; border-radius: 0 0 12px 12px; font-family: 'Inter', sans-serif; font-size: 14px; color: #e2e8f0; }
        .ql-editor { min-height: 150px; color: #e2e8f0; }
        .block-card { border: 1px solid #253142; background: #161e2b; border-radius: 12px; margin-bottom: 16px; padding: 16px; position: relative; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <header class="sticky top-0 z-50 glass-panel border-b border-brand-border/60">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-brand-teal flex items-center justify-center shadow-lg"><span class="font-display font-black text-black text-xl">X</span></div>
                <div><div class="font-display font-black text-xl text-white">Конструктор</div><div class="text-[10px] text-gray-400 uppercase font-semibold">Управление страницами</div></div>
            </div>
            <div class="flex items-center gap-3">
                <a href="admin.html" class="text-gray-400 hover:text-white transition-colors text-sm"><i class="fa-solid fa-arrow-left mr-1"></i> В админку</a>
                <button onclick="savePage()" id="save-btn" class="px-5 py-2 bg-brand-teal text-black font-bold text-sm rounded-xl hover:scale-105 transition-all shadow-lg flex items-center gap-2"><i class="fa-solid fa-floppy-disk"></i> Опубликовать</button>
            </div>
        </div>
    </header>

    <main class="flex-1 py-8">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-brand-card p-5 rounded-2xl border border-brand-border">
                    <h3 class="font-bold text-white mb-4">Настройки страницы</h3>
                    <div class="space-y-4">
                        <div><label class="block text-xs font-semibold text-gray-400 mb-1">Заголовок</label><input type="text" id="page-title-input" placeholder="Например: Антикор" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-teal"></div>
                        <div><label class="block text-xs font-semibold text-gray-400 mb-1">Ссылка (Slug)</label><div class="flex items-center"><span class="text-gray-500 text-xs bg-brand-dark border border-r-0 border-brand-border px-2 py-2 rounded-l-lg">?p=</span><input type="text" id="page-slug-input" placeholder="anticor" class="w-full bg-brand-dark border border-brand-border rounded-r-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-teal"></div></div>
                    </div>
                </div>
                <div class="bg-brand-card p-5 rounded-2xl border border-brand-border">
                    <h3 class="font-bold text-white mb-4">Добавить блок</h3>
                    <div class="flex flex-col gap-2">
                        <button onclick="addBlock('text')" class="w-full py-2 bg-brand-dark hover:bg-brand-border border border-brand-border rounded-lg text-sm text-white flex items-center gap-2 px-3"><i class="fa-solid fa-paragraph text-brand-teal"></i> Текст</button>
                        <button onclick="addBlock('image')" class="w-full py-2 bg-brand-dark hover:bg-brand-border border border-brand-border rounded-lg text-sm text-white flex items-center gap-2 px-3"><i class="fa-solid fa-image text-brand-teal"></i> Картинка</button>
                        <button onclick="addBlock('video')" class="w-full py-2 bg-brand-dark hover:bg-brand-border border border-brand-border rounded-lg text-sm text-white flex items-center gap-2 px-3"><i class="fa-brands fa-youtube text-brand-teal"></i> Видео</button>
                        <button onclick="addBlock('alert')" class="w-full py-2 bg-brand-dark hover:bg-brand-border border border-brand-border rounded-lg text-sm text-white flex items-center gap-2 px-3"><i class="fa-solid fa-triangle-exclamation text-brand-teal"></i> Предупреждение</button>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-3">
                <div id="blocks-container" class="space-y-4"></div>
                <div id="empty-state" class="text-center py-20 border-2 border-dashed border-brand-border rounded-3xl bg-brand-card/30">
                    <i class="fa-solid fa-layer-group text-5xl text-gray-600 mb-4"></i>
                    <h3 class="text-lg font-bold text-white mb-1">Пока нет блоков</h3>
                    <p class="text-gray-400 text-sm">Нажмите «Добавить блок» слева, чтобы начать.</p>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { supabase } from './js/config.js';
        let blocks = []; 
        let quillInstances = {};
        let editingPageId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            const { data: adminData } = await supabase.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
            if (!adminData) { window.location.href = 'index.html'; return; }
            if (id) { editingPageId = id; document.getElementById('save-btn').innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Обновить'; await loadExistingPage(id); }
        });

        async function loadExistingPage(id) {
            const { data: page } = await supabase.from('custom_pages').select('*').eq('id', id).single();
            if (page) {
                document.getElementById('page-title-input').value = page.title;
                document.getElementById('page-slug-input').value = page.slug;
                blocks = page.blocks || [];
                renderBlocks();
            }
        }

        window.addBlock = function(type) {
            const id = Date.now().toString();
            blocks.push({ id, type, content: '', url: '', alt: '' });
            renderBlocks();
        };

        window.removeBlock = function(id) { blocks = blocks.filter(b => b.id !== id); delete quillInstances[id]; renderBlocks(); };
        window.moveBlock = function(id, direction) {
            const index = blocks.findIndex(b => b.id === id);
            if (direction === 'up' && index > 0) [blocks[index - 1], blocks[index]] = [blocks[index], blocks[index - 1]];
            else if (direction === 'down' && index < blocks.length - 1) [blocks[index + 1], blocks[index]] = [blocks[index], blocks[index + 1]];
            renderBlocks();
        };

        function renderBlocks() {
            const container = document.getElementById('blocks-container');
            const emptyState = document.getElementById('empty-state');
            blocks.forEach(block => { if (block.type === 'text' && quillInstances[block.id]) block.content = quillInstances[block.id].root.innerHTML; });
            if (blocks.length === 0) { container.innerHTML = ''; emptyState.classList.remove('hidden'); return; }
            emptyState.classList.add('hidden');
            container.innerHTML = ''; quillInstances = {};

            blocks.forEach((block, index) => {
                const div = document.createElement('div'); div.className = 'block-card';
                let blockHeader = `<div class="flex justify-between items-center mb-3"><span class="text-xs font-bold text-brand-teal uppercase tracking-wider">${block.type === 'text' ? 'Текст' : block.type === 'image' ? 'Картинка' : block.type === 'video' ? 'Видео' : 'Предупреждение'}</span><div class="flex gap-1">${index > 0 ? `<button onclick="moveBlock('${block.id}', 'up')" class="p-1 text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-up"></i></button>` : ''}${index < blocks.length - 1 ? `<button onclick="moveBlock('${block.id}', 'down')" class="p-1 text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-down"></i></button>` : ''}<button onclick="removeBlock('${block.id}')" class="p-1 text-red-400 hover:text-red-300 ml-2"><i class="fa-solid fa-trash"></i></button></div></div>`;
                let blockContent = '';
                if (block.type === 'text') blockContent = `<div id="editor-${block.id}" style="min-height: 100px;"></div>`;
                else if (block.type === 'image') blockContent = `<input type="text" placeholder="Ссылка на картинку (https://...)" value="${block.url || ''}" oninput="updateField('${block.id}', 'url', this.value)" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-sm text-white mb-2"><input type="text" placeholder="Описание (Alt-текст)" value="${block.alt || ''}" oninput="updateField('${block.id}', 'alt', this.value)" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-sm text-white">`;
                else if (block.type === 'video') blockContent = `<input type="text" placeholder="Ссылка на YouTube (https://www.youtube.com/embed/...)" value="${block.url || ''}" oninput="updateField('${block.id}', 'url', this.value)" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-sm text-white">`;
                else if (block.type === 'alert') blockContent = `<textarea placeholder="Текст предупреждения..." oninput="updateField('${block.id}', 'content', this.value)" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-sm text-white h-20 resize-none">${block.content || ''}</textarea>`;
                div.innerHTML = blockHeader + blockContent; container.appendChild(div);

                if (block.type === 'text') {
                    quillInstances[block.id] = new Quill(`#editor-${block.id}`, { theme: 'snow', modules: { toolbar: [['bold', 'italic'], [{ 'header': [2, 3, false] }], [{ 'list': 'ordered'}, { 'list': 'bullet' }], ['link']] } });
                    if (block.content) quillInstances[block.id].clipboard.dangerouslyPasteHTML(block.content);
                }
            });
        }

        window.updateField = function(id, field, value) { const block = blocks.find(b => b.id === id); if (block) block[field] = value; };

        window.savePage = async function() {
            const title = document.getElementById('page-title-input').value; const slug = document.getElementById('page-slug-input').value;
            const btn = document.getElementById('save-btn');
            if (!title || !slug) { alert('Заполните заголовок и ссылку (slug)'); return; }
            blocks.forEach(block => { if (block.type === 'text' && quillInstances[block.id]) block.content = quillInstances[block.id].root.innerHTML; });
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Сохранение...'; btn.disabled = true;
            const pageData = { title, slug, blocks, status: 'published' };
            let error;
            if (editingPageId) { const res = await supabase.from('custom_pages').update(pageData).eq('id', editingPageId); error = res.error; } 
            else { const res = await supabase.from('custom_pages').insert([pageData]); error = res.error; }
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Опубликовать'; btn.disabled = false;
            if (error) alert('Ошибка: ' + error.message);
            else { alert('Страница успешно сохранена!'); if (!editingPageId) window.location.href = 'admin.html'; }
        };
    </script>
</body>
</html>
